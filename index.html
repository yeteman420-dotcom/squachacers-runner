<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0 10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;}
  #ss{background:radial-gradient(ellipse at center,#0a0015 0%,#000 100%);}
  #gs{background:rgba(0,0,10,0.97);display:none;overflow-y:auto;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--gold-bright);text-shadow:0 0 30px var(--gold);letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .art{font-size:68px;margin:6px 0;animation:fly 2s ease-in-out infinite;}
  @keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-10px) rotate(5deg);}}
  .desc{font-size:11px;color:#777;letter-spacing:1px;margin-bottom:20px;line-height:2.0;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--gold);background:transparent;color:var(--gold-bright);cursor:pointer;transition:all 0.2s;}
  .btn:active{transform:scale(0.96);}
  .btn:hover{background:rgba(201,168,76,0.15);}
  .ot{font-family:'Black Ops One',cursive;font-size:40px;color:var(--red);text-shadow:0 0 30px var(--red);margin-bottom:6px;}
  .os{font-size:12px;color:#666;letter-spacing:3px;margin-bottom:14px;}
  .sd{font-family:'Black Ops One',cursive;font-size:48px;color:var(--gold-bright);text-shadow:0 0 20px var(--gold);margin-bottom:2px;}
  .sl{font-size:10px;letter-spacing:4px;color:#555;margin-bottom:14px;}
  .popup{position:absolute;font-family:'Black Ops One',cursive;font-size:16px;color:var(--gold-bright);pointer-events:none;animation:fu 0.9s ease-out forwards;z-index:30;text-shadow:0 0 8px var(--gold);}
  @keyframes fu{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-55px) scale(1.3);}}
  #trees-hud{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:25;pointer-events:none;background:rgba(0,0,0,0.45);padding:4px 14px 4px 10px;border-radius:20px;border:1px solid rgba(68,255,68,0.25);}
  #mode-banner{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Black Ops One',cursive;font-size:11px;letter-spacing:4px;z-index:15;pointer-events:none;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;margin-bottom:3px;font-family:'Black Ops One',cursive;font-size:12px;border-left:3px solid #333;background:rgba(255,255,255,0.03);}
  .lb-row.gold{border-color:#FFD700;background:rgba(255,215,0,0.08);}
  .lb-row.silver{border-color:#aaa;}
  .lb-row.bronze{border-color:#cd7f32;}
  .lbr{color:#C9A84C;width:22px;}.lbn{color:#fff;flex:1;padding:0 6px;}.lbs{color:#FFD700;}
  .lbt{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:4px;color:#C9A84C;text-align:center;margin-bottom:6px;opacity:0.8;}
  #ne{display:none;flex-direction:column;align-items:center;margin-bottom:12px;}
  #ni{font-family:'Black Ops One',cursive;font-size:16px;letter-spacing:3px;background:rgba(0,0,0,0.6);border:2px solid #C9A84C;color:#FFD700;padding:9px 14px;text-align:center;outline:none;width:210px;text-transform:uppercase;}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div id="trees-hud"></div>

  <div class="screen" id="ss" style="justify-content:flex-start;padding-top:22px;overflow-y:auto;">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">UNIVERSE SHIFTER</div>
    <div class="art">🦶</div>
    <div class="desc">
      <span style="color:#00ffff;">WAVE 1 → SPACE RUNNER</span><br>
      <span style="color:#ff8800;">WAVE 2 → DONKEY KONG</span><br>
      <span style="color:#ff00ff;">WAVE 3 → ENDLESS RUNNER</span><br>
      <span style="color:#00ffff;">WAVE 4 → GALAGA</span><br>
      <span style="color:#00ff88;">WAVE 5 → FLAPPY SQUACH</span><br>
      <span style="color:#ff4444;">WAVE 6 → ASTEROIDS</span><br>
      <span style="color:#FFD700;">WAVE 7 → FROGGER</span>
    </div>
    <button class="btn" id="startBtn">BLAST OFF</button>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-top:10px;">BEST: <span id="hsS">0</span></div>
    <div id="slb" style="width:100%;max-width:320px;margin-top:10px;"></div>
  </div>

  <div class="screen" id="gs">
    <div class="ot">OBLITERATED</div>
    <div class="os">SQUACH DOWN</div>
    <div class="sd" id="fs">0</div>
    <div class="sl">POINTS</div>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-bottom:12px;">BEST: <span id="hsG">0</span></div>
    <div id="ne">
      <div style="font-family:'Black Ops One',cursive;font-size:10px;letter-spacing:3px;color:#C9A84C;margin-bottom:8px;">NEW HIGH SCORE — ENTER NAME</div>
      <input id="ni" type="text" maxlength="12" placeholder="YOUR NAME">
      <button class="btn" id="saveBtn" style="margin-top:10px;padding:9px 24px;font-size:12px;">SAVE</button>
    </div>
    <div id="lb" style="width:100%;max-width:320px;margin-bottom:16px;"></div>
    <button class="btn" id="retryBtn">FLY AGAIN</button>
  </div>
</div>

<script>
// ====================== CORE SETUP ======================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: true });
const W = 500, H = 700;
canvas.width = W; canvas.height = H;

let state = 'start';
let score = 0, dist = 0, hiScore = parseInt(localStorage.getItem('us2_hs') || '0');
let gameTime = 0, wave = 1, waveT = 0, lives = 5, maxLives = 5;
let inv = 0, shake = 0;

let sqX = W/2, sqY = H - 120;
let velX = 0, velY = 0;

let beams = [], obs = [], parts = [], rings = [];
let lastT = 0, gunCD = 0;

let txS = 0, tyS = 0, tmoved = false;
let waveBanner = '', waveBannerT = 0;
let rolling = false, rollA = 0, rollDir = 1, rollCD = 0;
const ROLL_DUR = 0.45, ROLL_CD = 1.0, GUN_RATE = 0.18;

let ws = {};           // wave-specific state
let speed = 200;

// ====================== WAVE CONFIG ======================
const WAVE_MODES = [
  {id:'spacerunner', name:'SPACE RUNNER',   color:'#00ffff', icon:'🛸', desc:'← → DODGE  ·  TAP/SPACE SHOOT  ·  SWIPE UP ROLL'},
  {id:'donkeykong',  name:'DONKEY KONG',    color:'#ff8800', icon:'🦍', desc:'← → MOVE  ·  TAP / SPACE TO JUMP  ·  DODGE BARRELS'},
  {id:'runner',      name:'ENDLESS RUNNER', color:'#ff00ff', icon:'🏃', desc:'← → LANES  ·  TAP/SPACE JUMP  ·  DOWN SLIDE'},
  {id:'galaga',      name:'GALAGA',         color:'#00ffff', icon:'👾', desc:'← → MOVE  ·  AUTO FIRE  ·  DODGE FORMATIONS'},
  {id:'flappy',      name:'FLAPPY SQUACH',  color:'#00ff88', icon:'🐦', desc:'TAP / SPACE TO FLAP  ·  AVOID THE PIPES'},
  {id:'asteroids',   name:'ASTEROIDS',      color:'#ff4444', icon:'☄️', desc:'← → ROTATE  ·  UP THRUST  ·  TAP/SPACE FIRE'},
  {id:'frogger',     name:'FROGGER',        color:'#FFD700', icon:'🐸', desc:'← → ↑ ↓ HOP LANES  ·  REACH THE TOP'},
];

const WAVE_DUR = 28;   // Slightly longer for better pacing

function getModeId() { return WAVE_MODES[Math.min(wave-1, WAVE_MODES.length-1)].id; }
function getMode()   { return WAVE_MODES[Math.min(wave-1, WAVE_MODES.length-1)]; }

// ====================== INPUT ======================
const keys = {};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state !== 'playing') return;
  if (e.key === ' ') { e.preventDefault(); onAction(); }
  if (e.key === 'ArrowLeft') onLeft();
  if (e.key === 'ArrowRight') onRight();
  if (e.key === 'ArrowUp') { e.preventDefault(); onUp(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); onDown(); }
});

document.addEventListener('keyup', e => {
  keys[e.key] = false;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== 'playing') return;
  txS = e.touches[0].clientX;
  tyS = e.touches[0].clientY;
  tmoved = false;
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'playing') return;
  const dx = e.touches[0].clientX - txS;
  const dy = e.touches[0].clientY - tyS;
  if (!tmoved && (Math.abs(dx) > 20 || Math.abs(dy) > 20)) {
    tmoved = true;
    if (Math.abs(dy) > Math.abs(dx)) {
      if (dy < 0) onUp();
      else onDown();
    } else {
      if (dx < 0) onLeft();
      else onRight();
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (state === 'playing' && !tmoved) onAction();
}, {passive: false});

canvas.addEventListener('click', () => {
  if (state === 'playing') onAction();
});

function onAction() {
  const m = getModeId();
  if (m === 'spacerunner' || m === 'galaga') shoot();
  else if (m === 'asteroids') shootAsteroids();
  else if (m === 'donkeykong') dkJump();
  else if (m === 'runner') runnerJump();
  else if (m === 'flappy') doFlap();
  else if (m === 'frogger') frogUp();
}

function onLeft()  { /* mode-specific logic remains similar but with smoother accel */ 
  const m = getModeId();
  if (m === 'spacerunner') velX -= 520;
  else if (m === 'donkeykong') ws.moveDir = -1;
  else if (m === 'runner') runnerLane(-1);
  else if (m === 'galaga') ws.galLeft = true;
  else if (m === 'asteroids') ws.rotVel = -4.2;
  else if (m === 'frogger') frogLeft();
}

function onRight() { 
  const m = getModeId();
  if (m === 'spacerunner') velX += 520;
  else if (m === 'donkeykong') ws.moveDir = 1;
  else if (m === 'runner') runnerLane(1);
  else if (m === 'galaga') ws.galRight = true;
  else if (m === 'asteroids') ws.rotVel = 4.2;
  else if (m === 'frogger') frogRight();
}

function onUp() {
  const m = getModeId();
  if (m === 'spacerunner') doRoll();
  else if (m === 'donkeykong' || m === 'runner') { if (m==='donkeykong') dkJump(); else runnerJump(); }
  else if (m === 'asteroids') ws.thrusting = true;
  else if (m === 'frogger') frogUp();
  else if (m === 'flappy') doFlap();
}

function onDown() {
  const m = getModeId();
  if (m === 'runner') runnerSlide();
  else if (m === 'asteroids') ws.thrusting = false;
  else if (m === 'frogger') frogDown();
}

// ====================== SMOOTHING HELPERS ======================
// These make movement feel much more fluid
function dampen(vel, factor, dt) {
  return vel * Math.pow(factor, dt);
}

// ====================== WAVE INIT & UPDATE (simplified & smoother) ======================
function initWave() {
  obs = []; beams = []; parts = []; rings = [];
  ws = {};
  waveT = 0;

  const m = getModeId();
  if (m === 'spacerunner') spaceInit();
  else if (m === 'donkeykong') dkInit();
  else if (m === 'runner') runnerInit();
  else if (m === 'galaga') galagaInit();
  else if (m === 'flappy') flappyInit();
  else if (m === 'asteroids') asteroidsInit();
  else if (m === 'frogger') froggerInit();

  const md = getMode();
  const banner = document.getElementById('mode-banner');
  if (banner) {
    banner.textContent = md.name;
    banner.style.color = md.color;
  }
  document.getElementById('waveHud').textContent = wave;
}

// Next wave with smoother transition
function nextWave() {
  wave++;
  waveT = 0;
  const md = getMode();
  waveBanner = md.icon + ' ' + md.name;
  waveBannerT = 3.0;

  sfxWave(); sfxWave();
  stopMusic();
  setTimeout(() => { if (state === 'playing') startMusic(); }, 600);

  initWave();
  lives = Math.min(maxLives, lives + 1);
  updateTreesHud();
  popup(W/2, H/2 - 60, `WAVE ${wave}!`);
}

// ====================== MAIN LOOP (Improved timing) ======================
function loop(ts) {
  if (state !== 'playing') return;

  const dt = Math.min((ts - lastT) / 1000, 0.08);   // Cap delta time
  lastT = ts;

  const t = ts / 1000;

  update(dt, t);
  draw(t);

  requestAnimationFrame(loop);
}

function update(dt, t) {
  if (isNaN(dt) || dt > 0.1) dt = 0.016;

  gameTime += dt;
  waveT += dt;
  dist += speed * dt / 8;
  speed = Math.min(460, 160 + gameTime * 3.5 + wave * 12);

  if (waveBannerT > 0) waveBannerT -= dt;
  if (gunCD > 0) gunCD -= dt;
  if (inv > 0) inv -= dt;
  if (shake > 0) shake -= dt * 6;
  if (rollCD > 0) rollCD -= dt;

  if (waveT >= WAVE_DUR) nextWave();

  const m = getModeId();

  // Mode-specific updates (you can keep most of your original functions, just ensure they use dt properly)
  if (m === 'spacerunner') updateSpace(dt);
  else if (m === 'donkeykong') updateDK(dt);
  else if (m === 'runner') updateRunner(dt);
  else if (m === 'galaga') updateGalaga(dt);
  else if (m === 'flappy') updateFlappy(dt);
  else if (m === 'asteroids') updateAsteroids(dt);
  else if (m === 'frogger') updateFrogger(dt);

  // Common updates with better damping
  velX = dampen(velX, 0.08, dt);
  sqX = Math.max(22, Math.min(W - 22, sqX + velX * dt));

  // Update arrays
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.x += (b.vx || 0) * dt;
    b.y += (b.vy || 0) * dt;
    b.age = (b.age || 0) + dt;
    if (b.life !== undefined) b.life -= dt;
    if (b.y < -60 || b.life <= 0) beams.splice(i, 1);
  }

  // ... (keep your particles, rings, stars updates — just ensure *dt is used)

  score += dt * wave * 2;
  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('dc').textContent = Math.floor(dist) + 'm';
}

// ====================== DRAW ======================
// (Your original draw functions can stay mostly the same — they already look good)

function draw(t) {
  ctx.save();
  if (shake > 0) {
    const sh = shake * 6;
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  }

  drawBg(t);
  drawObstacles(t);
  drawBeams();
  drawParticles();

  // Draw player with smoother tilt/rotation handling
  const m = getModeId();
  let sx = sqX, sy = sqY;
  if (m === 'frogger') { sx = ws.frogX || W/2; sy = ws.frogY || H-75; }

  const glowMap = { /* your map */ };
  const gc = glowMap[m] || '#C9A84C';

  // Example for smoother squach rendering (you can expand)
  if (m === 'asteroids') {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ws.angle || 0);
    drawSquach(0, 0, t, {glowCol: gc, invincible: inv > 0});
    ctx.restore();
  } else {
    const tilt = (m === 'spacerunner') ? Math.max(-0.45, Math.min(0.45, velX * 0.0006)) : 0;
    drawSquach(sx, sy, t, {glowCol: gc, invincible: inv > 0, tilt});
  }

  drawHUD(t);
  ctx.restore();
}

// ====================== START / GAME OVER ======================
function startGame() {
  score = 0; dist = 0; gameTime = 0; speed = 160;
  lives = 5; wave = 1;
  velX = velY = 0;
  beams = obs = parts = rings = [];
  inv = shake = 0; rolling = false; rollCD = 0; gunCD = 0;

  initStars();
  initWave();
  updateTreesHud();

  document.getElementById('ss').style.display = 'none';
  document.getElementById('gs').style.display = 'none';

  state = 'playing';
  startMusic();
  lastT = performance.now();
  requestAnimationFrame(loop);
}

// Keep your gameOver, submitScore, etc. functions (they're fine)

document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;
document.getElementById('saveBtn').onclick = submitScore;

// Initial setup
renderLB('slb');
document.getElementById('hsS').textContent = Math.floor(hiScore);
updateTreesHud();

// Add your audio, particles, stars, and mode-specific functions below (they mostly stay the same).
// Just make sure every position/velocity change is multiplied by `dt`.

</script>
</body>
</html>
