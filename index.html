<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;border:2px solid #222;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0-10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;}
  #ss{background:radial-gradient(ellipse at center,#0a0015 0%,#000 100%);}
  #gs{background:rgba(0,0,10,0.97);display:none;overflow-y:auto;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--gold-bright);text-shadow:0 0 30px var(--gold);letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .art{font-size:68px;margin:6px 0;animation:fly 2s ease-in-out infinite;}
  @keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-10px) rotate(5deg);}}
  .desc{font-size:12px;color:#777;letter-spacing:1px;margin-bottom:20px;line-height:1.9;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--gold);background:transparent;color:var(--gold-bright);cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
  .btn:active{transform:scale(0.96);}
  .ot{font-family:'Black Ops One',cursive;font-size:40px;color:var(--red);text-shadow:0 0 30px var(--red);margin-bottom:6px;}
  .sd{font-family:'Black Ops One',cursive;font-size:48px;color:var(--gold-bright);text-shadow:0 0 20px var(--gold);margin-bottom:2px;}
  #trees-hud{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:25;pointer-events:none;background:rgba(0,0,0,0.45);padding:4px 14px;border-radius:20px;border:1px solid rgba(201,168,76,0.3);}
  #wave-label{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-family:'Black Ops One',cursive;font-size:12px;letter-spacing:4px;z-index:15;pointer-events:none;}
  .lb-row{display:flex;justify-content:space-between;width:100%;padding:4px 10px;font-size:11px;color:#eee;border-bottom:1px solid #222;}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="wave-label">DIMENSION ALPHA</div>
  <div id="trees-hud"></div>
  
  <div class="screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">UNIVERSE SHIFTER</div>
    <div class="art">🛸</div>
    <div class="desc">SWIPE LEFT/RIGHT TO DODGE<br>TAP TO FIRE LASERS<br>SURVIVE THE DIMENSION SHIFT</div>
    <button class="btn" id="startBtn">START MISSION</button>
  </div>

  <div class="screen" id="gs">
    <div class="ot">MISSION FAILED</div>
    <div class="sd" id="fs">0</div>
    <div style="color:var(--gold);margin-bottom:20px;">FINAL SCORE</div>
    <button class="btn" id="retryBtn">RE-ENTER VOID</button>
  </div>
</div>

<script>
/**
 * SQUACHACERS: UNIVERSE SHIFTER
 * Logic: Every wave (level) changes the background rendering style, 
 * enemy behavior, and music/visual atmosphere.
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 700;
canvas.width = W; canvas.height = H;

const THEMES = [
  { name: 'DEEP SPACE', bg1: '#000008', bg2: '#000018', style: 'classic', enemyBehavior: 'normal', color: '#00ffff' },
  { name: 'HELL DIMENSION', bg1: '#0a0000', bg2: '#200000', style: 'hell', enemyBehavior: 'aggressive', color: '#ff2200' },
  { name: 'NEON RAVE', bg1: '#050005', bg2: '#100010', style: 'rave', enemyBehavior: 'zigzag', color: '#ff00ff' },
  { name: 'ABYSSAL SEA', bg1: '#00050a', bg2: '#001020', style: 'abyss', enemyBehavior: 'swarm', color: '#00ffaa' },
  { name: 'THE VOID', bg1: '#000000', bg2: '#050005', style: 'void', enemyBehavior: 'teleport', color: '#8800ff' },
  { name: 'RETRO GOLD', bg1: '#0a0800', bg2: '#151000', style: 'retro', enemyBehavior: 'normal', color: '#FFD700' },
  { name: 'CYBER STORM', bg1: '#000508', bg2: '#001020', style: 'cyber', enemyBehavior: 'grid', color: '#00ffff' }
];

let state = 'start', score = 0, dist = 0, wave = 1;
let sqX = W/2, velX = 0, inv = 0, lives = 3;
let obs = [], beams = [], particles = [], warpStars = [];
let lastT = 0, gameTime = 0, waveT = 0;

function initStars() {
  warpStars = [];
  for(let i=0; i<150; i++) {
    warpStars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*W, s: Math.random()*2+1 });
  }
}

function applyTheme() {
  const th = THEMES[Math.min(wave-1, THEMES.length-1)];
  document.getElementById('wave-label').textContent = th.name;
  document.getElementById('wave-label').style.color = th.color;
}

function spawnEnemy() {
  const th = THEMES[Math.min(wave-1, THEMES.length-1)];
  const size = 20 + Math.random()*15;
  obs.push({
    x: Math.random()*(W-40)+20,
    y: -50,
    vy: 200 + (wave*20),
    size: size,
    hp: Math.ceil(wave/2),
    color: th.color,
    type: 'alien',
    behavior: th.enemyBehavior,
    t: 0
  });
}

function drawBackground(t) {
  const th = THEMES[Math.min(wave-1, THEMES.length-1)];
  ctx.fillStyle = th.bg1;
  ctx.fillRect(0, 0, W, H);

  // Dynamic Styles per Level
  if(th.style === 'classic') {
    warpStars.forEach(s => {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
      s.y += (speed/50) * s.s; if(s.y > H) s.y = -10;
    });
  } 
  else if(th.style === 'hell') {
    ctx.globalAlpha = 0.2;
    for(let i=0; i<5; i++) {
      ctx.fillStyle = '#ff3300';
      ctx.beginPath(); ctx.arc(W/2 + Math.sin(t+i)*100, H + 50 - (i*40), 150, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  else if(th.style === 'rave') {
    ctx.strokeStyle = th.color; ctx.globalAlpha = 0.1;
    for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
    for(let i=0; i<H; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  else if(th.style === 'abyss') {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, th.bg1); g.addColorStop(1, '#004466');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.1; ctx.fillStyle = '#fff';
    for(let i=0; i<10; i++) ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
    ctx.globalAlpha = 1;
  }
  else if(th.style === 'cyber') {
    ctx.fillStyle = '#0f0'; ctx.font = '10px monospace'; ctx.globalAlpha = 0.1;
    for(let i=0; i<20; i++) ctx.fillText(Math.random().toString(2).substr(2,8), (i*25), (t*100 + i*50)%H);
    ctx.globalAlpha = 1;
  }
}

function update(dt) {
  gameTime += dt; waveT += dt;
  dist += (200 + wave*20) * dt / 10;
  score = Math.floor(dist * 1.5);
  
  if(waveT > 20) { wave++; waveT = 0; applyTheme(); lives = Math.min(3, lives+1); updateLives(); }

  // Input
  sqX += velX * dt; velX *= 0.9;
  if(sqX < 30) sqX = 30; if(sqX > W-30) sqX = W-30;

  // Enemies
  if(Math.random() < 0.03) spawnEnemy();
  obs.forEach((o, i) => {
    o.y += o.vy * dt;
    if(o.behavior === 'zigzag') o.x += Math.sin(gameTime*5)*3;
    if(o.y > H + 50) obs.splice(i, 1);
    
    // Collision Squach
    if(inv <= 0 && Math.hypot(o.x - sqX, o.y - (H-100)) < o.size + 15) {
      lives--; inv = 1.5; obs.splice(i, 1); updateLives();
      if(lives <= 0) state = 'gameover';
    }
  });

  // Beams
  beams.forEach((b, i) => {
    b.y -= 600 * dt;
    if(b.y < -20) beams.splice(i, 1);
    obs.forEach((o, j) => {
      if(Math.hypot(b.x - o.x, b.y - o.y) < o.size + 5) {
        o.hp--; beams.splice(i, 1);
        if(o.hp <= 0) { score += 100; obs.splice(j, 1); }
      }
    });
  });

  if(inv > 0) inv -= dt;
  document.getElementById('sc').textContent = score;
  document.getElementById('dc').textContent = Math.floor(dist) + 'm';
  document.getElementById('waveHud').textContent = wave;
}

function draw() {
  drawBackground(gameTime);
  
  // Draw Squach (Simplified for engine)
  ctx.save();
  ctx.translate(sqX, H-100);
  if(inv > 0 && Math.floor(gameTime*10)%2 === 0) ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#4a3522'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(-7, -5, 3, 0, Math.PI*2); ctx.arc(7, -5, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Draw Objects
  obs.forEach(o => {
    ctx.fillStyle = o.color; ctx.shadowBlur = 10; ctx.shadowColor = o.color;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Draw Beams
  beams.forEach(b => {
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y+15); ctx.stroke();
  });
}

function updateLives() {
  const container = document.getElementById('trees-hud');
  container.innerHTML = '🌲'.repeat(lives);
}

function loop(ts) {
  if(state !== 'playing') {
    if(state === 'gameover') {
      document.getElementById('gs').style.display = 'flex';
      document.getElementById('fs').textContent = score;
    }
    return;
  }
  const dt = (ts - lastT) / 1000; lastT = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// Controls
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') velX = -400;
  if(e.key === 'ArrowRight') velX = 400;
  if(e.key === ' ') { beams.push({x: sqX, y: H-120}); }
});

canvas.addEventListener('touchstart', e => {
  const touchX = e.touches[0].clientX;
  const rect = canvas.getBoundingClientRect();
  const x = (touchX - rect.left) * (W / rect.width);
  if(x < sqX) velX = -500; else velX = 500;
  beams.push({x: sqX, y: H-120});
});

document.getElementById('startBtn').onclick = () => {
  state = 'playing'; score = 0; dist = 0; wave = 1; lives = 3;
  obs = []; beams = []; lastT = performance.now();
  document.getElementById('ss').style.display = 'none';
  applyTheme(); updateLives(); initStars();
  requestAnimationFrame(loop);
};

document.getElementById('retryBtn').onclick = () => location.reload();

initStars();
</script>
</body>
</html>
