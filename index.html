<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter — Final Boss Build</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh}
#gc{position:relative;width:min(500px,100vw);height:min(700px,100vh)}
canvas{width:100%;height:100%;display:block}
#bossHud{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:320px;height:18px;border:2px solid var(--gold);display:none;z-index:100}
#bossBar{height:100%;width:100%;background:linear-gradient(90deg,#ff3333,#FFD700)}
#bossName{position:absolute;top:35px;left:50%;transform:translateX(-50%);font-family:'Black Ops One',cursive;color:#FFD700;display:none;z-index:100}
</style>
</head>
<body>
<div id="gc">
<canvas id="c"></canvas>
<div id="bossName"></div>
<div id="bossHud"><div id="bossBar"></div></div>
</div>
<script>
/* FULL MERGED BUILD
   Includes:
   - Fixed broken DOCTYPE
   - Stable game loop timing
   - Collision cleanup fixes
   - Beam cleanup fixes
   - Boss system every 3rd wave
   - Unique bosses
*/
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=500; canvas.height=700;
const W=500,H=700;let state='playing'; let wave=1; let score=0; let lives=5; let sqX=W/2,sqY=H-100; let beams=[]; let obs=[]; let lastT=0; let boss=null; let bossMode=false;

const BOSSES=[ {name:'VOID APE',hp:60,color:'#ff8800',type:'charge'}, {name:'ASTRO HYDRA',hp:120,color:'#44aaff',type:'spread'}, {name:'WARP QUEEN',hp:200,color:'#ff00ff',type:'teleport'} ];

function shoot(){ beams.push({x:sqX,y:sqY,vx:0,vy:-500}); }

function spawnEnemy(){ obs.push({ x:Math.random()W, y:-20, vy:120+wave20, size:20 }); }

function spawnBoss(){ const b=BOSSES[(Math.floor(wave/3)-1)%BOSSES.length]; boss={ ...b, maxHp:b.hp, x:W/2, y:100, vx:150, timer:0 }; bossMode=true; document.getElementById('bossHud').style.display='block'; document.getElementById('bossName').style.display='block'; document.getElementById('bossName').textContent=b.name; }

function killBoss(){ score+=wave*1000; boss=null; bossMode=false; document.getElementById('bossHud').style.display='none'; document.getElementById('bossName').style.display='none'; wave++; }

function nextWave(){ wave++; obs=[]; if(wave%3===0){ spawnBoss(); } }

function updateBoss(dt){ if(!boss)return; boss.timer+=dt;

if(boss.type==='charge'){ boss.x+=boss.vxdt; if(boss.x<50||boss.x>W-50) boss.vx=-1; if(Math.random()<0.03){ obs.push({x:boss.x,y:boss.y,size:18,vy:300}); } }

if(boss.type==='spread'){ boss.x=W/2+Math.sin(boss.timer*2)160; if(Math.random()<0.04){ for(let i=-2;i<=2;i++){ obs.push({x:boss.x+i20,y:boss.y,size:10,vy:220}); } } }

if(boss.type==='teleport'){ if(boss.timer>2){ boss.timer=0; boss.x=Math.random()*(W-100)+50; for(let i=0;i<8;i++){ obs.push({x:Math.random()*W,y:-20,size:8,vy:260}); } } }

for(let i=beams.length-1;i>=0;i--){ const b=beams[i]; if(Math.hypot(b.x-boss.x,b.y-boss.y)<50){ boss.hp--; beams.splice(i,1); if(boss.hp<=0){ killBoss(); break; } } }

document.getElementById('bossBar').style.width=((boss.hp/boss.maxHp)*100)+'%'; }

function update(dt){ if(Math.random()<0.02&&!bossMode)spawnEnemy();

for(let i=beams.length-1;i>=0;i--){ const b=beams[i]; b.y+=b.vy*dt; if(b.y<-20)beams.splice(i,1); }

for(let i=obs.length-1;i>=0;i--){ const o=obs[i]; o.y+=o.vy*dt;

if(Math.hypot(o.x-sqX,o.y-sqY)<25){ lives--; obs.splice(i,1); if(lives<=0)state='gameover'; continue; }

for(let j=beams.length-1;j>=0;j--){ if(Math.hypot(o.x-beams[j].x,o.y-beams[j].y)<20){ score+=100; obs.splice(i,1); beams.splice(j,1); break; } }

if(o.y>H+20)obs.splice(i,1); }

if(bossMode)updateBoss(dt);

if(score>0&&score%2000<5&&!bossMode){ nextWave(); } }

function drawPlayer(){ ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(sqX,sqY,20,0,Math.PI*2); ctx.fill(); }

function drawBoss(){ if(!boss)return; ctx.save(); ctx.fillStyle=boss.color; ctx.shadowBlur=20; ctx.shadowColor=boss.color; ctx.beginPath(); ctx.arc(boss.x,boss.y,40,0,Math.PI*2); ctx.fill(); ctx.restore(); }

function draw(){ ctx.clearRect(0,0,W,H);

drawPlayer();

beams.forEach(b=>{ ctx.strokeStyle='#00ffff'; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x,b.y-15); ctx.stroke(); });

obs.forEach(o=>{ ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(o.x,o.y,o.size,0,Math.PI*2); ctx.fill(); });

drawBoss();

ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.fillText('Score: '+score,20,30); ctx.fillText('Wave: '+wave,20,60); ctx.fillText('Lives: '+lives,20,90); }

function loop(ts){ if(state==='gameover'){ ctx.fillStyle='#fff'; ctx.font='40px sans-serif'; ctx.fillText('GAME OVER',140,350); return; } const dt=Math.min((ts-lastT)/1000,0.033); lastT=ts; update(dt); draw(); requestAnimationFrame(loop); }

window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')sqX=Math.max(20,sqX-30); if(e.key==='ArrowRight')sqX=Math.min(W-20,sqX+30); if(e.key===' ')shoot(); });

requestAnimationFrame(loop); </script>

</body>
</html>
