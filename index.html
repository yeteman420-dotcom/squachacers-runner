<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0 10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;}
  #ss{background:radial-gradient(ellipse at center,#0a0015 0%,#000 100%);}
  #gs{background:rgba(0,0,10,0.97);display:none;overflow-y:auto;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--gold-bright);text-shadow:0 0 30px var(--gold);letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .art{font-size:68px;margin:6px 0;animation:fly 2s ease-in-out infinite;}
  @keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-10px) rotate(5deg);}}
  .desc{font-size:11px;color:#777;letter-spacing:1px;margin-bottom:20px;line-height:2.0;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--gold);background:transparent;color:var(--gold-bright);cursor:pointer;transition:all 0.2s;}
  .btn:active{transform:scale(0.96);}
  .btn:hover{background:rgba(201,168,76,0.15);}
  .ot{font-family:'Black Ops One',cursive;font-size:40px;color:var(--red);text-shadow:0 0 30px var(--red);margin-bottom:6px;}
  .os{font-size:12px;color:#666;letter-spacing:3px;margin-bottom:14px;}
  .sd{font-family:'Black Ops One',cursive;font-size:48px;color:var(--gold-bright);text-shadow:0 0 20px var(--gold);margin-bottom:2px;}
  .sl{font-size:10px;letter-spacing:4px;color:#555;margin-bottom:14px;}
  .popup{position:absolute;font-family:'Black Ops One',cursive;font-size:16px;color:var(--gold-bright);pointer-events:none;animation:fu 0.9s ease-out forwards;z-index:30;text-shadow:0 0 8px var(--gold);}
  @keyframes fu{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-55px) scale(1.3);}}
  #trees-hud{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:25;pointer-events:none;background:rgba(0,0,0,0.45);padding:4px 14px 4px 10px;border-radius:20px;border:1px solid rgba(68,255,68,0.25);}
  #mode-banner{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Black Ops One',cursive;font-size:11px;letter-spacing:4px;z-index:15;pointer-events:none;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;margin-bottom:3px;font-family:'Black Ops One',cursive;font-size:12px;border-left:3px solid #333;background:rgba(255,255,255,0.03);width:260px;}
  .lb-row.gold{border-color:#FFD700;background:rgba(255,215,0,0.08);}
  .lb-row.silver{border-color:#aaa;}
  .lb-row.bronze{border-color:#cd7f32;}
  .lbr{color:#C9A84C;width:22px;}.lbn{color:#fff;flex:1;padding:0 6px;}.lbs{color:#FFD700;}
  .lbt{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:4px;color:#C9A84C;text-align:center;margin-bottom:6px;opacity:0.8;}
  #ne{display:none;flex-direction:column;align-items:center;margin-bottom:12px;}
  #ni{font-family:'Black Ops One',cursive;font-size:16px;letter-spacing:3px;background:rgba(0,0,0,0.6);border:2px solid #C9A84C;color:#FFD700;padding:9px 14px;text-align:center;outline:none;width:210px;text-transform:uppercase;}
  #lb-container{max-height:200px;overflow-y:auto;margin-bottom:12px;}
  .tree-icon{font-size:20px;}
  .tree-off{opacity:0.2;}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div id="trees-hud"></div>

  <div id="ss" class="screen">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">UNIVERSE SHIFTER</div>
    <div class="art">🛸</div>
    <div class="desc">
      TAP / CLICK / SPACE to shift dimensions<br>
      Dodge obstacles across shifting universes<br>
      Collect 🌲 to power your dimensional drive
    </div>
    <button class="btn" id="sb">INITIATE SHIFT</button>
  </div>

  <div id="gs" class="screen">
    <div class="ot">SIGNAL LOST</div>
    <div class="os">UNIVERSE COLLAPSED</div>
    <div class="sd" id="fs">0</div>
    <div class="sl">FINAL SCORE</div>
    <div class="lbt">LEADERBOARD</div>
    <div id="lb-container"></div>
    <div id="ne">
      <div class="sl" style="margin-bottom:6px;">ENTER PILOT NAME</div>
      <input id="ni" maxlength="12" placeholder="CALLSIGN">
      <button class="btn" id="nb" style="margin-top:10px;">LOG ENTRY</button>
    </div>
    <button class="btn" id="rb">RE-ENGAGE</button>
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const ss = document.getElementById('ss'), gs = document.getElementById('gs');
  const scEl = document.getElementById('sc'), dcEl = document.getElementById('dc');
  const waveEl = document.getElementById('waveHud'), fsEl = document.getElementById('fs');
  const modeBanner = document.getElementById('mode-banner'), treesHud = document.getElementById('trees-hud');
  const ne = document.getElementById('ne'), ni = document.getElementById('ni'), nb = document.getElementById('nb');
  const lbContainer = document.getElementById('lb-container');

  let W, H, running = false, over = false, score = 0, dist = 0, wave = 1;
  let speed = 3, frame = 0, trees = 0, shiftReady = false, shifting = false, shiftTimer = 0;
  let mode = 'forest';
  let modeTimer = 0, modeDuration = 600;
  let particles = [], obstacles = [], collectibles = [], stars = [];

  const modes = ['forest','desert','ice','void'];
  const modeColors = {
    forest:{bg:'#051a05',ground:'#1a4a1a',obs:'#2d5a27',sky:'#0a2a0a',accent:'#4aff4a'},
    desert:{bg:'#1a0f00',ground:'#4a3a1a',obs:'#8a6a3a',sky:'#2a1a0a',accent:'#ffaa44'},
    ice:{bg:'#0a0a1a',ground:'#1a3a4a',obs:'#4a7a8a',sky:'#0a1a2a',accent:'#44aaff'},
    void:{bg:'#0a0015',ground:'#2a1a3a',obs:'#5a3a6a',sky:'#1a0a2a',accent:'#aa44ff'}
  };
  const modeNames = {forest:'🌲 FOREST SECTOR',desert:'🏜️ DESERT SECTOR',ice:'❄️ ICE SECTOR',void:'👁️ VOID SECTOR'};

  function resize(){
    const rect = document.getElementById('gc').getBoundingClientRect();
    W = c.width = rect.width; H = c.height = rect.height;
  }
  window.addEventListener('resize', resize); resize();

  for(let i=0;i<80;i++) stars.push({x:Math.random()*500,y:Math.random()*700,s:Math.random()*1.5+0.5,a:Math.random()});

  const player = {x:0,y:0,r:18,vy:0,grav:0.45,jump:-7.5,groundY:0,angle:0,tilt:0};

  function reset(){
    score = 0; dist = 0; wave = 1; speed = 3; trees = 0; frame = 0;
    mode = 'forest'; modeTimer = 0; shifting = false; shiftReady = false; shiftTimer = 0;
    obstacles = []; collectibles = []; particles = [];
    player.y = H - 80; player.vy = 0; player.groundY = H - 60; player.tilt = 0;
    scEl.textContent = '0'; dcEl.textContent = '0m'; waveEl.textContent = '1';
    modeBanner.textContent = modeNames.forest; modeBanner.style.color = '#4aff4a';
    updateTreesHud();
  }

  function updateTreesHud(){
    let s = '';
    for(let i=0;i<5;i++) s += '<span class="tree-icon ' + (i<trees?'':'tree-off') + '">🌲</span>';
    treesHud.innerHTML = s;
  }

  function spawnObs(){
    const groundY = H - 60;
    const type = Math.random() < 0.3 ? 'air' : 'ground';
    const w = 20 + Math.random()*25;
    const h = 20 + Math.random()*35;
    if(type === 'ground'){
      obstacles.push({x:W+20,y:groundY-h,w,h,type:'ground'});
    } else {
      obstacles.push({x:W+20,y:groundY-55-Math.random()*70,w,h,type:'air'});
    }
  }

  function spawnCollectible(){
    const groundY = H - 60;
    collectibles.push({x:W+30,y:groundY-30-Math.random()*80,r:10,taken:false,type:Math.random()<0.2?'gem':'tree'});
  }

  function addParticles(x,y,color,count=8){
    for(let i=0;i<count;i++){
      particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color});
    }
  }

  function showPopup(text,x,y){
    const el = document.createElement('div');
    el.className = 'popup'; el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.getElementById('gc').appendChild(el);
    setTimeout(()=>el.remove(),900);
  }

  function shiftUniverse(){
    if(shifting) return;
    shifting = true; shiftTimer = 40;
    let next = modes[(modes.indexOf(mode)+1)%modes.length];
    mode = next; modeTimer = 0;
    modeBanner.textContent = modeNames[mode];
    modeBanner.style.color = modeColors[mode].accent;
    addParticles(W/2,H/2,'#FFD700',30);
    trees = 0; updateTreesHud();
  }

  function jump(){
    if(!running || over) return;
    if(player.y >= player.groundY - 2){
      player.vy = player.jump;
      addParticles(player.x,player.y+10,'#aaa',5);
    }
  }

  function doShift(){
    if(!running || over) return;
    if(trees >= 5){
      shiftUniverse();
    } else if(shiftReady){
      jump();
    }
  }

  function update(){
    if(!running || over) return;
    frame++;
    dist += speed * 0.05;
    score += 1;
    dcEl.textContent = Math.floor(dist) + 'm';
    scEl.textContent = score;

    if(dist > wave * 300){
      wave++; waveEl.textContent = wave; speed += 0.4;
      showPopup('WAVE ' + wave, W/2-30, H/2);
    }

    modeTimer++;
    if(modeTimer > modeDuration && trees >= 5){
      shiftReady = true;
    }

    if(shifting){
      shiftTimer--;
      if(shiftTimer <= 0) shifting = false;
    }

    player.vy += player.grav;
    player.y += player.vy;
    if(player.y > player.groundY){
      player.y = player.groundY; player.vy = 0;
    }
    player.angle += 0.08;
    player.tilt = player.tilt * 0.9 + (player.vy * 0.04);

    if(frame % Math.max(30, 90 - wave*5) === 0) spawnObs();
    if(frame % 120 === 0) spawnCollectible();

    for(let i=obstacles.length-1;i>=0;i--){
      let o = obstacles[i]; o.x -= speed;
      if(!o.hit && o.x < player.x+player.r && o.x+o.w > player.x-player.r &&
         player.y-player.r < o.y+o.h && player.y+player.r > o.y){
        o.hit = true; gameOver();
      }
      if(o.x + o.w < -20) obstacles.splice(i,1);
    }

    for(let i=collectibles.length-1;i>=0;i--){
      let col = collectibles[i]; col.x -= speed;
      if(!col.taken){
        let dx = player.x - col.x, dy = player.y - col.y;
        if(dx*dx + dy*dy < (player.r+col.r)**2){
          col.taken = true;
          if(col.type === 'tree'){
            trees = Math.min(5, trees+1); updateTreesHud();
            score += 50; showPopup('+🌲', col.x, col.y);
            if(trees >= 5) showPopup('SHIFT READY!', W/2-40, H/2-40);
          } else {
            score += 100; showPopup('+100', col.x, col.y);
          }
          addParticles(col.x,col.y,'#FFD700',10);
        }
      }
      if(col.x < -30) collectibles.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.04;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  // Draw the Squach ship with canvas primitives
  function drawShip(x, y, tilt, thrust){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    
    // Shadow / glow
    ctx.shadowColor = modeColors[mode].accent;
    ctx.shadowBlur = 15;
    
    // Main fuselage - sleek teardrop
    ctx.fillStyle = '#2a2a3a';
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.quadraticCurveTo(8, -10, -14, -6);
    ctx.quadraticCurveTo(-20, 0, -14, 6);
    ctx.quadraticCurveTo(8, 10, 18, 0);
    ctx.fill();
    
    // Cockpit canopy
    ctx.fillStyle = '#44aaff';
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(2, -2, 7, 4, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Wing left
    ctx.fillStyle = '#3a3a4a';
    ctx.shadowColor = modeColors[mode].accent;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo(-4, -6);
    ctx.lineTo(-16, -14);
    ctx.lineTo(-8, -4);
    ctx.closePath();
    ctx.fill();
    
    // Wing right
    ctx.beginPath();
    ctx.moveTo(-4, 6);
    ctx.lineTo(-16, 14);
    ctx.lineTo(-8, 4);
    ctx.closePath();
    ctx.fill();
    
    // Engine glow
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 100, 50, ${0.6 + 0.4*Math.sin(frame*0.4)})`;
    ctx.beginPath();
    ctx.moveTo(-18, -3);
    ctx.lineTo(-26 - thrust*8, 0);
    ctx.lineTo(-18, 3);
    ctx.closePath();
    ctx.fill();
    
    // Inner engine core
    ctx.fillStyle = `rgba(255, 220, 100, ${0.8 + 0.2*Math.sin(frame*0.5)})`;
    ctx.beginPath();
    ctx.moveTo(-18, -1.5);
    ctx.lineTo(-22 - thrust*5, 0);
    ctx.lineTo(-18, 1.5);
    ctx.closePath();
    ctx.fill();
    
    // Accent stripe
    ctx.strokeStyle = modeColors[mode].accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-10, 0);
    ctx.stroke();
    
    ctx.restore();
  }

  function draw(){
    const colors = modeColors[mode];
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#fff';
    for(let s of stars){
      ctx.globalAlpha = s.a * (0.5 + 0.5*Math.sin(frame*0.02 + s.x));
      ctx.beginPath(); ctx.arc(s.x%W, s.y%H, s.s, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const groundY = H - 60;
    ctx.fillStyle = colors.ground;
    ctx.fillRect(0, groundY, W, 60);
    ctx.strokeStyle = colors.obs; ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0;i<W;i+=20){
      ctx.moveTo(i, groundY); ctx.lineTo(i+10, groundY+5);
    }
    ctx.stroke();

    if(shifting){
      ctx.fillStyle = 'rgba(255,255,255,' + (shiftTimer/40)*0.4 + ')';
      ctx.fillRect(0,0,W,H);
    }

    for(let o of obstacles){
      ctx.fillStyle = colors.obs;
      if(o.type === 'ground'){
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = colors.bg;
        for(let j=0;j<o.w;j+=8){
          ctx.beginPath();
          ctx.moveTo(o.x+j, o.y); ctx.lineTo(o.x+j+4, o.y-6); ctx.lineTo(o.x+j+8, o.y);
          ctx.fill();
        }
      } else {
        ctx.beginPath();
        ctx.arc(o.x+o.w/2, o.y+o.h/2, o.w/2, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    for(let col of collectibles){
      if(col.taken) continue;
      ctx.font = '20px serif';
      ctx.textAlign = 'center';
      ctx.fillText(col.type==='tree'?'🌲':'💎', col.x, col.y+7);
    }

    // Draw the Squach ship
    const thrust = player.y < player.groundY - 2 ? 1.5 : 0.5;
    drawShip(player.x, player.y, player.tilt, thrust);

    for(let p of particles){
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-2, p.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if(speed > 5){
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      for(let i=0;i<5;i++){
        let lx = (frame*speed*2 + i*100) % (W+100) - 50;
        ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx-40, H); ctx.stroke();
      }
    }
  }

  function loop(){
    update(); draw();
    if(running) requestAnimationFrame(loop);
  }

  function start(){
    reset(); running = true; over = false;
    ss.style.display = 'none'; gs.style.display = 'none';
    player.x = 60; player.y = player.groundY;
    loop();
  }

  function gameOver(){
    over = true; running = false;
    fsEl.textContent = score;
    gs.style.display = 'flex';
    renderLeaderboard();
    let lb = JSON.parse(localStorage.getItem('sq_lb')||'[]');
    if(lb.length < 10 || score > (lb[lb.length-1]?.s||0)){
      ne.style.display = 'flex'; ni.focus();
    } else {
      ne.style.display = 'none';
    }
  }

  function renderLeaderboard(){
    let lb = JSON.parse(localStorage.getItem('sq_lb')||'[]');
    lbContainer.innerHTML = '';
    lb.forEach((e,i)=>{
      let row = document.createElement('div');
      row.className = 'lb-row' + (i===0?' gold':i===1?' silver':i===2?' bronze':'');
      row.innerHTML = `<span class="lbr">#${i+1}</span><span class="lbn">${e.n}</span><span class="lbs">${e.s}</span>`;
      lbContainer.appendChild(row);
    });
  }

  function saveScore(){
    let name = ni.value.trim() || 'UNKNOWN';
    let lb = JSON.parse(localStorage.getItem('sq_lb')||'[]');
    lb.push({n:name, s:score, d:Date.now()});
    lb.sort((a,b)=>b.s-a.s); lb = lb.slice(0,10);
    localStorage.setItem('sq_lb', JSON.stringify(lb));
    ne.style.display = 'none';
    renderLeaderboard();
  }

  document.getElementById('sb').addEventListener('click', start);
  document.getElementById('rb').addEventListener('click', start);
  nb.addEventListener('click', saveScore);

  window.addEventListener('keydown', e=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if(!running && !over && ss.style.display !== 'none') start();
      else if(over && gs.style.display !== 'none'){}
      else doShift();
    }
  });

  c.addEventListener('mousedown', e=>{ if(running && !over) doShift(); });
  c.addEventListener('touchstart', e=>{ e.preventDefault(); if(running && !over) doShift(); });

  resize(); draw();
})();
</script>
</body>
</html>
