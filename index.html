<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter 19X</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;--neon:#44ff44;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;border:2px solid #333;background:#000;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0 10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;background:rgba(0,0,0,0.85);}
  #ss{background:radial-gradient(ellipse at center,#0a150a 0%,#000 100%);}
  #gs{display:none;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--neon);text-shadow:0 0 30px #2e7d32;letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--neon);background:transparent;color:var(--neon);cursor:pointer;transition:all 0.2s;z-index:30;}
  .btn:active{transform:scale(0.96);}
  #mode-banner{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Black Ops One',cursive;font-size:14px;letter-spacing:4px;z-index:15;pointer-events:none;text-shadow:0 0 10px #000;color:var(--neon);}
  .popup{position:absolute;font-family:'Black Ops One',cursive;font-size:16px;color:var(--neon);pointer-events:none;animation:fu 0.9s ease-out forwards;z-index:30;}
  @keyframes fu{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">OBLITERATIONS</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">GRID_DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div class="screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">19X UNIVERSE SHIFTER</div>
    <div style="font-size:60px;margin:20px;">🦶</div>
    <button class="btn" id="startBtn">INITIALIZE ORTHOSCAN</button>
  </div>
  <div class="screen" id="gs">
    <div style="font-family:'Black Ops One';color:var(--red);font-size:40px;">SQUACH DOWN</div>
    <div id="fs" style="font-size:48px;color:#fff;">0</div>
    <button class="btn" id="retryBtn" style="margin-top:20px;">RE-SCAN</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=500,H=700;
canvas.width=W;canvas.height=H;

const WAVE_MODES=[
  {id:'modtoes', name:'MODTOE ALIGNMENT', color:'#44ff44', icon:'🦶'},
  {id:'cryptid', name:'CRYPTID CREEK',    color:'#2e7d32', icon:'🕵️‍♂️'},
  {id:'spacer',  name:'SPACE RUNNER',     color:'#00ffff', icon:'🛸'},
];

let state='start',score=0,dist=0,wave=1,waveT=0,lives=5,inv=0;
let sqX=W/2,sqY=H-120,txS=W/2,speed=200;
let obs=[],parts=[],ws={};
let lastT=0;

// --- UTILS ---
function spawnParts(x,y,col){for(let i=0;i<8;i++)parts.push({x,y,vx:(Math.random()-0.5)*150,vy:(Math.random()-0.5)*150,life:1,c:col});}
function popup(x,y,txt){const e=document.createElement('div');e.className='popup';e.textContent=txt;const r=canvas.getBoundingClientRect();e.style.left=(r.left+x)+'px';e.style.top=(r.top+y)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),900);}
function takeDamage(){if(inv>0)return;lives--;inv=1.5;if(lives<=0)gameOver();}

// --- INPUT ---
const getX=(e)=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.touches?e.touches[0].clientX:e.clientX;
  return (x-rect.left)*(W/rect.width);
};
canvas.addEventListener('touchstart',e=>{e.preventDefault();txS=getX(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();txS=getX(e);},{passive:false});
canvas.addEventListener('mousemove',e=>{txS=getX(e);});

// --- WAVE LOGIC ---
function initWave(){
  obs=[];ws={spawnT:1};
}

function updateModToes(dt){
  ws.spawnT-=dt;
  if(ws.spawnT<=0){
    obs.push({type:'modtoe',x:Math.random()*(W-40)+20,y:-50,vy:300+(wave*15)});
    ws.spawnT=0.8;
  }
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.y+=o.vy*dt;
    if(Math.hypot(o.x-sqX,o.y-sqY)<45){
      score+=100;popup(o.x,o.y,"MODTOE ALIGNED");spawnParts(o.x,o.y,'#44ff44');obs.splice(i,1);
    }else if(o.y>H){takeDamage();obs.splice(i,1);}
  }
}

function updateCryptid(dt){
  ws.spawnT-=dt;
  if(ws.spawnT<=0){
    obs.push({type:'acer',x:Math.random()*(W-40)+20,y:-50,vy:450});
    ws.spawnT=0.5;
  }
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.y+=o.vy*dt;
    if(Math.hypot(o.x-sqX,o.y-sqY)<40){
      takeDamage();spawnParts(o.x,o.y,'#ff3333');obs.splice(i,1);
    }else if(o.y>H){score+=50;obs.splice(i,1);}
  }
}

function drawSquach(t){
  ctx.save();ctx.translate(sqX,sqY);
  if(inv>0 && Math.floor(t*10)%2===0)ctx.globalAlpha=0.3;
  ctx.shadowBlur=15;ctx.shadowColor=getMode().color;
  // Body
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(0,0,20,25,0,0,Math.PI*2);ctx.fill();
  // ModToes
  ctx.fillStyle=getMode().color;
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*7,22,3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function getMode(){return WAVE_MODES[(wave-1)%WAVE_MODES.length];}

function loop(ts){
  if(state!=='playing')return;
  const dt=Math.min((ts-lastT)/1000,0.1);lastT=ts;
  waveT+=dt;dist+=speed*dt/10;
  sqX+=(txS-sqX)*0.15;sqX=Math.max(25,Math.min(W-25,sqX));

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  
  // OrthoScan Grid
  ctx.strokeStyle='#152515';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}

  const m=getMode().id;
  if(m==='modtoes')updateModToes(dt);
  else if(m==='cryptid')updateCryptid(dt);
  else updateModToes(dt);

  obs.forEach(o=>{
    ctx.font='34px serif';ctx.textAlign='center';
    ctx.fillText(o.type==='modtoe'?'🦶':'🕵️‍♂️',o.x,o.y+10);
  });

  parts.forEach((p,i)=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.fillStyle=p.c;ctx.globalAlpha=p.life;
    ctx.fillRect(p.x,p.y,3,3);
    if(p.life<=0)parts.splice(i,1);
  });

  drawSquach(ts/1000);

  if(waveT>15){wave++;waveT=0;initWave();
    const b=document.getElementById('mode-banner');
    b.textContent=getMode().name;b.style.color=getMode().color;
  }

  if(inv>0)inv-=dt;
  document.getElementById('sc').textContent=score;
  document.getElementById('dc').textContent=Math.floor(dist)+'m';
  document.getElementById('waveHud').textContent=wave;

  requestAnimationFrame(loop);
}

function gameOver(){
  state='gameover';
  document.getElementById('gs').style.display='flex';
  document.getElementById('fs').textContent=score;
}

function startGame(){
  score=0;dist=0;wave=1;waveT=0;lives=5;inv=0;state='playing';
  document.getElementById('ss').style.display='none';
  document.getElementById('gs').style.display='none';
  const b=document.getElementById('mode-banner');
  b.textContent=getMode().name;b.style.color=getMode().color;
  initWave();lastT=performance.now();requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
</script>
</body>
</html>
