<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter 19X</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;--neon:#44ff44;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;border:2px solid #222;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0 10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;}
  #ss{background:radial-gradient(ellipse at center,#0a150a 0%,#000 100%);}
  #gs{background:rgba(0,10,0,0.97);display:none;overflow-y:auto;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--neon);text-shadow:0 0 30px #2e7d32;letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--neon);background:transparent;color:var(--neon);cursor:pointer;transition:all 0.2s;}
  .btn:active{transform:scale(0.96);}
  #mode-banner{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Black Ops One',cursive;font-size:14px;letter-spacing:4px;z-index:15;pointer-events:none;text-shadow:0 0 10px #000;}
  .popup{position:absolute;font-family:'Black Ops One',cursive;font-size:16px;color:var(--neon);pointer-events:none;animation:fu 0.9s ease-out forwards;z-index:30;}
  @keyframes fu{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">OBLITERATIONS</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">GRID_DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div class="screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">19X UNIVERSE SHIFTER</div>
    <div style="font-size:60px;margin:20px;">🦶</div>
    <button class="btn" id="startBtn">INITIALIZE ORTHOSCAN</button>
  </div>
  <div class="screen" id="gs">
    <div style="font-family:'Black Ops One';color:var(--red);font-size:40px;">SQUACH DOWN</div>
    <div id="fs" style="font-size:48px;color:#fff;">0</div>
    <button class="btn" id="retryBtn" style="margin-top:20px;">RE-SCAN</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=500,H=700;
canvas.width=W;canvas.height=H;

const WAVE_MODES=[
  {id:'modtoes', name:'MODTOE ALIGNMENT', color:'#44ff44', icon:'🦶', desc:'SLOT THE MODTOES (TOE SPACERS)'},
  {id:'cryptid', name:'CRYPTID CREEK',    color:'#2e7d32', icon:'🕵️‍♂️', desc:'DODGE THE ACERS INVESTIGATORS'},
  {id:'spacer',  name:'SPACE RUNNER',     color:'#00ffff', icon:'🛸', desc:'OBLITERATE ALIENS'},
  {id:'kong',    name:'SQUACH KONG',      color:'#ff8800', icon:'🦍', desc:'DODGE BARRELS'},
];

let state='start',score=0,dist=0,wave=1,waveT=0,lives=5,inv=0;
let sqX=W/2,sqY=H-120,velX=0,speed=200;
let obs=[],beams=[],parts=[];
let lastT=0,txS=W/2;

function getMode(){return WAVE_MODES[(wave-1)%WAVE_MODES.length];}

// --- CORE ENGINE ---
function spawnParts(x,y,col){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,life:1,c:col});}
function popup(x,y,txt){const e=document.createElement('div');e.className='popup';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),900);}
function takeDamage(){if(inv>0)return;lives--;inv=1.5;if(lives<=0)gameOver();}

// --- INPUT ---
canvas.addEventListener('touchmove',e=>{e.preventDefault();txS=e.touches[0].clientX-(window.innerWidth-W)/2;},{passive:false});
canvas.addEventListener('mousemove',e=>{txS=e.offsetX;});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')txS-=30;if(e.key==='ArrowRight')txS+=30;});

// --- WAVE LOGIC ---
function initWave(){
  obs=[];ws={};const m=getMode().id;
  if(m==='modtoes'){ws.spawnT=1;sqY=H-100;}
  if(m==='cryptid'){ws.spawnT=0.8;sqY=H-100;}
}

function updateModToes(dt){
  sqX+=(txS-sqX)*0.2;
  ws.spawnT-=dt;
  if(ws.spawnT<=0){
    obs.push({type:'modtoe',x:Math.random()*W,y:-50,vy:300+wave*20,size:20});
    ws.spawnT=0.7;
  }
  obs.forEach((o,i)=>{
    o.y+=o.vy*dt;
    if(Math.hypot(o.x-sqX,o.y-sqY)<40){
      score+=100;popup(o.x,o.y,"+100 MODTOE");spawnParts(o.x,o.y,'#44ff44');obs.splice(i,1);
    }
    if(o.y>H){takeDamage();obs.splice(i,1);}
  });
}

function updateCryptid(dt){
  sqX+=(txS-sqX)*0.2;
  ws.spawnT-=dt;
  if(ws.spawnT<=0){
    obs.push({type:'acer',x:Math.random()*W,y:-50,vy:400,size:25});
    ws.spawnT=0.5;
  }
  obs.forEach((o,i)=>{
    o.y+=o.vy*dt;
    if(Math.hypot(o.x-sqX,o.y-sqY)<40){takeDamage();obs.splice(i,1);}
    if(o.y>H){score+=50;obs.splice(i,1);}
  });
}

// --- DRAWING ---
function drawSquach(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.shadowBlur=15;ctx.shadowColor=getMode().color;
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(0,0,20,25,0,0,Math.PI*2);ctx.fill();
  // Drawing ModToes on the Squach
  ctx.fillStyle=getMode().color;
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*8,22,3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function loop(ts){
  if(state!=='playing')return;
  const dt=Math.min((ts-lastT)/1000,0.1);lastT=ts;
  waveT+=dt;dist+=speed*dt/10;
  
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  
  // OrthoScan Grid BG
  ctx.strokeStyle='#112211';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  
  const m=getMode().id;
  if(m==='modtoes')updateModToes(dt);
  else if(m==='cryptid')updateCryptid(dt);
  else updateModToes(dt); // Fallback

  obs.forEach(o=>{
    ctx.font='30px serif';ctx.textAlign='center';
    ctx.fillText(o.type==='modtoe'?'🦶':'🕵️‍♂️',o.x,o.y);
  });

  parts.forEach((p,i)=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.fillStyle=p.c;ctx.globalAlpha=p.life;
    ctx.fillRect(p.x,p.y,4,4);
    if(p.life<=0)parts.splice(i,1);
  });
  ctx.globalAlpha=1;

  if(inv>0){inv-=dt;if(Math.floor(ts/100)%2===0)drawSquach(sqX,sqY);}
  else drawSquach(sqX,sqY);

  if(waveT>20){wave++;waveT=0;initWave();
    const b=document.getElementById('mode-banner');
    b.textContent=getMode().name;b.style.color=getMode().color;
  }

  document.getElementById('sc').textContent=score;
  document.getElementById('dc').textContent=Math.floor(dist)+'m';
  document.getElementById('waveHud').textContent=wave;

  requestAnimationFrame(loop);
}

function gameOver(){
  state='gameover';
  document.getElementById('gs').style.display='flex';
  document.getElementById('fs').textContent=score;
}

function startGame(){
  score=0;dist=0;wave=1;waveT=0;lives=5;state='playing';
  document.getElementById('ss').style.display='none';
  document.getElementById('gs').style.display='none';
  const b=document.getElementById('mode-banner');
  b.textContent=getMode().name;b.style.color=getMode().color;
  initWave();lastT=performance.now();requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
</script>
</body>
</html>
