<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SquachAcers: 19X Universe Shifter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-green: #44ff44;
    --gold-leaf: #C9A84C;
    --alert-red: #ff3333;
    --ortho-blue: #00ffff;
    --tactical-bg: #010501;
    --ui-glow: 0 0 15px rgba(68, 255, 68, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

  body {
    background-color: #000;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    user-select: none;
    touch-action: none;
  }

  #game-container {
    position: relative;
    width: min(500px, 100vw);
    height: min(700px, 100vh);
    background-color: var(--tactical-bg);
    border: 2px solid #1a331a;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,1), var(--ui-glow);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: auto;
  }

  /* --- HUD INTERFACE --- */
  #tactical-hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    pointer-events: none;
    z-index: 100;
  }

  .hud-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.7);
    padding: 8px 15px;
    border: 1px solid rgba(68, 255, 68, 0.25);
    border-radius: 2px;
    min-width: 90px;
    backdrop-filter: blur(5px);
  }

  .label { font-family: 'Black Ops One', cursive; font-size: 10px; letter-spacing: 2px; color: var(--gold-leaf); }
  .value { font-family: 'Black Ops One', cursive; font-size: 26px; color: #fff; text-shadow: 0 0 12px var(--gold-leaf); }

  /* --- SCREEN ARCHITECTURE --- */
  .system-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 40px;
    text-align: center;
    background: rgba(0,0,0,0.96);
    backdrop-filter: blur(12px);
  }

  #start-screen { background: radial-gradient(circle at center, #0a240a 0%, #000 100%); }

  .logo-text {
    font-family: 'Black Ops One', cursive;
    font-size: 46px;
    color: var(--neon-green);
    text-shadow: 0 0 35px #1a5e1a;
    letter-spacing: 7px;
    margin-bottom: 5px;
  }

  .version-tag { font-family: 'Black Ops One', cursive; font-size: 14px; color: #666; letter-spacing: 7px; margin-bottom: 35px; }

  .action-btn {
    font-family: 'Black Ops One', cursive;
    font-size: 20px;
    letter-spacing: 4px;
    padding: 20px 55px;
    border: 2px solid var(--neon-green);
    background: transparent;
    color: var(--neon-green);
    cursor: pointer;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    margin-top: 25px;
  }

  .action-btn:hover { background: rgba(68, 255, 68, 0.1); box-shadow: 0 0 30px var(--neon-green); transform: scale(1.05); }

  #mode-indicator {
    position: absolute;
    top: 90px;
    width: 100%;
    text-align: center;
    font-family: 'Black Ops One', cursive;
    font-size: 13px;
    letter-spacing: 5px;
    z-index: 150;
    color: var(--neon-green);
  }

  #integrity-meter {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 150;
    background: rgba(0,0,0,0.6);
    padding: 10px 22px;
    border-radius: 40px;
    border: 1px solid rgba(68, 255, 68, 0.3);
  }

  .notification {
    position: absolute;
    font-family: 'Black Ops One', cursive;
    font-size: 22px;
    color: var(--neon-green);
    pointer-events: none;
    z-index: 500;
    animation: viralPop 1.2s ease-out forwards;
    text-shadow: 0 0 15px #000;
  }

  @keyframes viralPop {
    0% { opacity: 0; transform: translateY(30px) scale(0.6); }
    20% { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="main-canvas"></canvas>
  
  <div id="tactical-hud">
    <div class="hud-box"><div class="label">OBLITERATIONS</div><div class="value" id="score-val">0</div></div>
    <div class="hud-box"><div class="label">WAVE_SCAN</div><div class="value" id="wave-val">1</div></div>
    <div class="hud-box"><div class="label">GRID_DIST</div><div class="value" id="dist-val">0m</div></div>
  </div>

  <div id="mode-indicator"></div>
  <div id="integrity-meter"></div>

  <div class="system-screen" id="start-screen">
    <div class="logo-text">SQUACHACERS</div>
    <div class="version-tag">19X MASTER BUILD</div>
    <div style="font-size: 85px; margin: 25px 0; filter: drop-shadow(0 0 20px #2e7d32);">🦶</div>
    <div style="color: #bbb; font-size: 14px; line-height: 2; margin-bottom: 30px; letter-spacing: 1px;">
      ORTHOSCAN AI INITIALIZED<br>
      ALIGN MODTOE INTERFACE<br>
      AVOID ACERS INVESTIGATOR UNITS
    </div>
    <button class="action-btn" onclick="startHardwareSequence()">BOOT SCANNER</button>
  </div>

  <div class="system-screen" id="crash-screen" style="display:none;">
    <div style="font-family:'Black Ops One'; font-size:48px; color:var(--alert-red); text-shadow: 0 0 25px #600;">SQUACH DOWN</div>
    <div class="version-tag" style="color:var(--alert-red);">SCANNER CRITICAL FAILURE</div>
    <div id="final-stats" style="font-size: 65px; color: #fff; margin: 25px 0;">0</div>
    <button class="action-btn" onclick="startHardwareSequence()">RE-SCAN GRID</button>
  </div>
</div>

<script>
/**
 * 19X MASTER ENGINE - CORE ARCHITECTURE
 * Developer: Matthew Stokes (Sonny)
 * Components: ModToes Patent-Pending System
 */

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 500, H = 700;
canvas.width = W; canvas.height = H;

// --- DYNAMIC SYSTEM STATE ---
let gameState = 'standby';
let globalScore = 0;
let gridDistance = 0;
let currentWave = 1;
let integrityPoints = 5;
let invulnFrames = 0;
let lastTimestamp = 0;
let waveTimer = 0;
let targetX = W / 2;
let playerX = W / 2;
let playerY = H - 140;

// --- OBJECT BUFFERS ---
let activeObstacles = [];
let kineticBeams = [];
let particleBuffer = [];
let waveState = {};

const WAVE_DURATION = 35; 

// --- GAME GENRES (UNIVERSE SHIFT) ---
const SHIFT_MODES = [
  { id: 'modtoes', name: 'MODTOE ALIGNMENT', theme: '#44ff44', type: 'precision' },
  { id: 'creek', name: 'CRYPTID CREEK', theme: '#2e7d32', type: 'evasion' },
  { id: 'space', name: 'SPACE RUNNER', theme: '#00ffff', type: 'combat' }
];

// --- ADVANCED AUDIO (WEB AUDIO API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function triggerAudio(freq, wave, dur, vol = 0.15) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

// --- INPUT PROCESSING ---
function mapInputCoordinates(e) {
  const rect = canvas.getBoundingClientRect();
  const xPos = e.touches ? e.touches[0].clientX : e.clientX;
  targetX = (xPos - rect.left) * (W / rect.width);
}

canvas.addEventListener('mousemove', mapInputCoordinates);
canvas.addEventListener('touchmove', e => { e.preventDefault(); mapInputCoordinates(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { 
  if (gameState === 'active') executeViralAction(); 
  mapInputCoordinates(e);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') targetX -= 50;
  if (e.key === 'ArrowRight') targetX += 50;
  if (e.key === ' ' || e.key === 'ArrowUp') executeViralAction();
});

function executeViralAction() {
  const mode = SHIFT_MODES[(currentWave - 1) % SHIFT_MODES.length];
  if (mode.type === 'combat') {
    kineticBeams.push({ x: playerX, y: playerY - 35, vy: -950 });
    triggerAudio(750, 'square', 0.1);
  }
  if (mode.type === 'evasion') {
    waveState.fy -= 75;
    triggerAudio(450, 'sine', 0.12);
    checkCreekBoundary();
  }
}

// --- VISUAL FEEDBACK SYSTEMS ---
function notify(x, y, txt) {
  const div = document.createElement('div');
  div.className = 'notification';
  div.textContent = txt;
  const rect = canvas.getBoundingClientRect();
  div.style.left = (rect.left + x * (rect.width/W)) + 'px';
  div.style.top = (rect.top + y * (rect.height/H)) + 'px';
  document.getElementById('game-container').appendChild(div);
  setTimeout(() => div.remove(), 1200);
}

function updateIntegrityUI() {
  const meter = document.getElementById('integrity-meter');
  meter.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const span = document.createElement('span');
    span.textContent = '🌲';
    span.style.fontSize = '26px';
    span.style.opacity = i < integrityPoints ? '1' : '0.1';
    span.style.filter = i < integrityPoints ? 'drop-shadow(0 0 10px #4f4)' : 'none';
    span.style.transition = '0.5s';
    meter.appendChild(span);
  }
}

function checkCreekBoundary() {
  if (waveState.fy < 90) {
    globalScore += 1250;
    notify(W/2, H/2, "ACERS OBLITERATED!");
    triggerAudio(1000, 'sine', 0.5, 0.2);
    waveState.fy = H - 90;
    waveTimer = WAVE_DURATION; 
  }
}

// --- BOOT SEQUENCE ---
function startHardwareSequence() {
  globalScore = 0;
  gridDistance = 0;
  currentWave = 1;
  integrityPoints = 5;
  waveTimer = 0;
  gameState = 'active';
  activeObstacles = [];
  kineticBeams = [];
  
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('crash-screen').style.display = 'none';
  
  resetWaveEnvironment();
  lastTimestamp = performance.now();
  updateIntegrityUI();
  requestAnimationFrame(enterpriseLoop);
}

function resetWaveEnvironment() {
  const mode = SHIFT_MODES[(currentWave - 1) % SHIFT_MODES.length];
  waveState = { 
    nextSpawn: 1.0, 
    fy: H - 90, 
    fx: W / 2,
    gridOffset: 0
  };
  
  document.getElementById('mode-indicator').textContent = mode.name;
  document.getElementById('mode-indicator').style.color = mode.theme;
  document.getElementById('wave-val').textContent = currentWave;
  triggerAudio(200, 'sawtooth', 0.4);
}

function processIntegrityLoss(x, y) {
  if (invulnFrames > 0) return;
  integrityPoints--;
  invulnFrames = 2.0;
  triggerAudio(100, 'sawtooth', 0.5, 0.3);
  updateIntegrityUI();
  if (integrityPoints <= 0) systemShutDown();
}

function systemShutDown() {
  gameState = 'failed';
  document.getElementById('final-stats').textContent = Math.floor(globalScore);
  document.getElementById('crash-screen').style.display = 'flex';
}

// --- PHYSICS ARCHITECTURE ---
function runPhysicsEngine(dt, now) {
  const mode = SHIFT_MODES[(currentWave - 1) % SHIFT_MODES.length];
  waveTimer += dt;
  gridDistance += dt * 18;

  // Smoothing Player Movement
  playerX += (targetX - playerX) * 0.2;
  playerX = Math.max(35, Math.min(W - 35, playerX));

  // Entity Spawning
  waveState.nextSpawn -= dt;
  if (waveState.nextSpawn <= 0) {
    if (mode.id === 'modtoes') {
      activeObstacles.push({ id: 'modtoe', x: Math.random()*(W-80)+40, y:-60, vy: 350 + (currentWave * 20) });
    } else if (mode.id === 'creek') {
      activeObstacles.push({ id: 'investigator', x: Math.random()*W, y:-60, vy: 480 });
    } else {
      activeObstacles.push({ id: 'anomaly', x: Math.random()*W, y:-60, vy: 300 + (currentWave * 25) });
    }
    waveState.nextSpawn = Math.max(0.4, 0.9 - (currentWave * 0.1));
  }

  // Processing Obstacles
  for (let i = activeObstacles.length - 1; i >= 0; i--) {
    const o = activeObstacles[i];
    o.y += o.vy * dt;

    const px = mode.type === 'evasion' ? waveState.fx : playerX;
    const py = mode.type === 'evasion' ? waveState.fy : playerY;
    
    if (Math.hypot(o.x - px, o.y - py) < 50) {
      if (o.id === 'modtoe') {
        globalScore += 200;
        triggerAudio(900, 'sine', 0.2, 0.2);
        notify(o.x, o.y, "ALIGNMENT PERFECT!");
        activeObstacles.splice(i, 1);
      } else {
        processIntegrityLoss(px, py);
        activeObstacles.splice(i, 1);
      }
    } else if (o.y > H + 50) {
      if (o.id === 'modtoe') processIntegrityLoss(playerX, H - 20); 
      activeObstacles.splice(i, 1);
    }
  }

  // Combat Beams
  for (let j = kineticBeams.length - 1; j >= 0; j--) {
    const b = kineticBeams[j];
    b.y += b.vy * dt;
    if (b.y < -50) kineticBeams.splice(j, 1);

    for (let i = activeObstacles.length - 1; i >= 0; i--) {
      const o = activeObstacles[i];
      if (o.id !== 'modtoe' && Math.hypot(b.x - o.x, b.y - o.y) < 45) {
        globalScore += 75;
        activeObstacles.splice(i, 1);
        kineticBeams.splice(j, 1);
        break;
      }
    }
  }

  // State Transitions
  if (waveTimer >= WAVE_DURATION) {
    currentWave++;
    waveTimer = 0;
    resetWaveEnvironment();
  }
  if (invulnFrames > 0) invulnFrames -= dt;
}

// --- RENDERING ENGINE ---
function renderFrame(t) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  // High-Precision OrthoScan Technical Grid
  ctx.strokeStyle = '#122512';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const mode = SHIFT_MODES[(currentWave - 1) % SHIFT_MODES.length];

  // Entity Draw Loop
  activeObstacles.forEach(o => {
    ctx.shadowBlur = 20; ctx.shadowColor = mode.theme;
    ctx.font = '45px Arial'; ctx.textAlign = 'center';
    let icon = o.id === 'modtoe' ? '🦶' : o.id === 'investigator' ? '🕵️‍♂️' : '👾';
    ctx.fillText(icon, o.x, o.y + 15);
  });

  kineticBeams.forEach(b => {
    ctx.fillStyle = '#0ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
    ctx.fillRect(b.x - 3, b.y, 6, 25);
  });

  // Dynamic Branded Player (Squach + ModToes)
  const px = mode.type === 'evasion' ? waveState.fx : playerX;
  const py = mode.type === 'evasion' ? waveState.fy : playerY;
  
  ctx.save();
  ctx.translate(px, py);
  if (invulnFrames > 0 && Math.floor(t * 12) % 2 === 0) ctx.globalAlpha = 0.25;
  
  // Rendering the ModToe Modules
  ctx.fillStyle = mode.theme;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.arc(i * 9, 30, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Squach Anatomical Base
  ctx.shadowBlur = 30; ctx.shadowColor = mode.theme;
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath(); ctx.ellipse(0, 0, 25, 34, 0, 0, Math.PI * 2); ctx.fill();
  
  // Tactical Optic Sensors
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(-8, -12, 4.5, 0, Math.PI * 2); ctx.arc(8, -12, 4.5, 0, Math.PI * 2); ctx.fill();
  
  ctx.restore();

  // Final UI Synch
  document.getElementById('score-val').textContent = Math.floor(globalScore);
  document.getElementById('dist-val').textContent = Math.floor(gridDistance) + 'm';
}

function enterpriseLoop(ts) {
  if (gameState !== 'active') return;
  const dt = Math.min((ts - lastTimestamp) / 1000, 0.1);
  lastTimestamp = ts;
  runPhysicsEngine(dt, ts / 1000);
  renderFrame(ts / 1000);
  requestAnimationFrame(enterpriseLoop);
}
</script>
</body>
</html>
