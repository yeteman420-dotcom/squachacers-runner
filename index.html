<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SquachAcers: Universe Shifter 19X</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-bright: #FFD700; --red: #ff3333; --neon: #44ff44;
    --ortho-cyan: #00ffff; --tactical-bg: #010201; --ui-glow: rgba(68, 255, 68, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; outline: none; }
  body { background: #000; color: #fff; font-family: 'Exo 2', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
  #gc { position: relative; width: min(500px, 100vw); height: min(700px, 100vh); background: var(--tactical-bg); border: 2px solid #1a331a; overflow: hidden; box-shadow: 0 0 60px #000, 0 0 25px var(--ui-glow); }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 15px 20px; pointer-events: none; z-index: 100; }
  .hb { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.7); padding: 8px 14px; border: 1px solid rgba(68,255,68,0.2); border-radius: 2px; min-width: 95px; }
  .hl { font-family: 'Black Ops One', cursive; font-size: 10px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .hv { font-family: 'Black Ops One', cursive; font-size: 26px; color: #fff; text-shadow: 0 0 10px var(--gold); }
  .system-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 40px; text-align: center; background: rgba(0,0,0,0.97); backdrop-filter: blur(15px); }
  #ss { background: radial-gradient(circle at center, #0a220a 0%, #000 100%); }
  .logo { font-family: 'Black Ops One', cursive; font-size: 46px; color: var(--neon); text-shadow: 0 0 35px #1a5e1a; letter-spacing: 6px; margin-bottom: 5px; }
  .btn { font-family: 'Black Ops One', cursive; font-size: 20px; letter-spacing: 4px; padding: 20px 55px; border: 2px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; transition: 0.4s; text-transform: uppercase; margin-top: 25px; }
  .btn:hover { background: rgba(68,255,68,0.1); box-shadow: 0 0 30px var(--neon); }
  #mode-banner { position: absolute; top: 85px; width: 100%; text-align: center; font-family: 'Black Ops One', cursive; font-size: 14px; color: var(--neon); z-index: 150; }
  #integrity-meter { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 150; background: rgba(0,0,0,0.55); padding: 10px 22px; border-radius: 40px; border: 1px solid rgba(68,255,68,0.25); }
  .notification { position: absolute; font-family: 'Black Ops One', cursive; font-size: 22px; color: var(--neon); pointer-events: none; z-index: 500; animation: viralPop 1.2s ease-out forwards; }
  @keyframes viralPop { 0% { opacity: 0; transform: translateY(30px) scale(0.6); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-90px) scale(1.4); } }
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div id="integrity-meter"></div>
  <div class="system-screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div style="font-size: 85px; margin: 25px 0;">🦶</div>
    <button class="btn" onclick="initializeGame()">START ENGINE</button>
  </div>
  <div class="system-screen" id="gs" style="display:none;">
    <div style="font-family:'Black Ops One'; font-size:48px; color:var(--red);">SQUACH DOWN</div>
    <div id="final-stats" style="font-size: 65px; color: #fff; margin: 25px 0;">0</div>
    <button class="btn" onclick="initializeGame()">RE-SCAN GRID</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d', { alpha: false });
const W = 500, H = 700; canvas.width = W; canvas.height = H;

let state = 'standby', score = 0, dist = 0, wave = 1, lives = 5, inv = 0;
let sqX = W/2, sqY = H-140, txS = W/2, tyS = H-140, lastT = 0, waveT = 0, shake = 0;
let obs = [], beams = [], parts = [], ws = {};

const MODES = [
  { id:'modtoes', name:'MODTOE ALIGNMENT', col:'#44ff44', icon:'🦶', type:'align' },
  { id:'paccreek', name:'CRYPTID MAZE', col:'#00ffff', icon:'👾', type:'maze' },
  { id:'space', name:'SPACE RUNNER', col:'#00ffff', icon:'🛸', type:'dodge' },
  { id:'kong', name:'SQUACH KONG', col:'#ff8800', icon:'🦍', type:'jump' }
];

// --- INPUTS ---
function mapInput(e) {
  const r = canvas.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  txS = (x - r.left) * (W / r.width);
  tyS = (y - r.top) * (H / r.height);
}
canvas.addEventListener('mousemove', mapInput);
canvas.addEventListener('touchmove', e => { e.preventDefault(); mapInput(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { mapInput(e); if (state === 'active') executeAction(); }, { passive: false });

function executeAction() {
  const m = MODES[(wave-1)%MODES.length];
  if (m.type === 'dodge') beams.push({ x: sqX, y: sqY - 35, vy: -1000 });
  if (m.type === 'jump' && ws.grounded) { ws.vy = -18; ws.grounded = false; }
}

function updateIntegrityUI() {
  const container = document.getElementById('integrity-meter'); container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span'); s.textContent = '🌲';
    s.style.fontSize = '26px'; s.style.opacity = i < lives ? '1' : '0.1';
    container.appendChild(s);
  }
}

function initializeGame() {
  score = 0; wave = 1; lives = 5; dist = 0; waveT = 0; state = 'active';
  obs = []; beams = []; 
  document.getElementById('ss').style.display = 'none';
  document.getElementById('gs').style.display = 'none';
  setupWave(); lastT = performance.now(); updateIntegrityUI(); requestAnimationFrame(loop);
}

function setupWave() {
  const m = MODES[(wave - 1) % MODES.length];
  ws = { spawn: 1.2, vy: 0, grounded: true, fy: H - 90, fx: W / 2, dots: [] };
  if (m.type === 'maze') { // Pac-Man Level Setup
    for(let i=0; i<15; i++) ws.dots.push({x: Math.random()*(W-100)+50, y: Math.random()*(H-200)+100, active: true});
    sqX = W/2; sqY = H/2;
  }
  document.getElementById('mode-banner').textContent = m.icon + " " + m.name;
  document.getElementById('mode-banner').style.color = m.col;
  document.getElementById('waveHud').textContent = wave;
}

function loop(ts) {
  if (state !== 'active') return;
  const dt = Math.min((ts - lastT) / 1000, 0.1); lastT = ts;
  waveT += dt; dist += dt * 10;
  
  const m = MODES[(wave - 1) % MODES.length];

  // Fix: Move anywhere in Level 2 (Maze)
  if (m.type === 'maze') {
    sqX += (txS - sqX) * 0.15; sqY += (tyS - sqY) * 0.15;
  } else {
    sqX += (txS - sqX) * 0.22; sqY = H-140;
  }
  sqX = Math.max(30, Math.min(W-30, sqX)); sqY = Math.max(100, Math.min(H-100, sqY));

  // Spawning
  ws.spawn -= dt;
  if (ws.spawn <= 0) {
    if (m.type === 'maze') obs.push({ id:'acer', x: Math.random()*W, y:-50, vy: 250, vx: (Math.random()-0.5)*100 });
    else if (m.type === 'align') obs.push({ id:'modtoe', x: Math.random()*(W-80)+40, y:-60, vy: 350 });
    else obs.push({ id:'anom', x: Math.random()*W, y:-60, vy: 400 });
    ws.spawn = 0.8;
  }

  // Logic
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i]; o.y += o.vy * dt; if(o.vx) o.x += o.vx * dt;
    if (Math.hypot(o.x - sqX, o.y - sqY) < 45) {
      if (o.id === 'modtoe') { score += 250; obs.splice(i, 1); }
      else if (inv <= 0) { lives--; inv=2; shake=1.2; if(lives<=0) state='over'; obs.splice(i, 1); updateIntegrityUI(); }
    } else if (o.y > H + 50) obs.splice(i, 1);
  }

  if (m.type === 'maze') {
    ws.dots.forEach(d => { if(d.active && Math.hypot(d.x-sqX, d.y-sqY) < 30) { d.active = false; score += 100; }});
    if (ws.dots.every(d => !d.active)) { score += 1000; waveT = 40; }
  }

  if (waveT > 35) { wave++; waveT = 0; setupWave(); }
  if (inv > 0) inv -= dt; if (shake > 0) shake -= dt * 4;

  // Draw
  ctx.save(); if(shake > 0) ctx.translate((Math.random()-0.5)*shake*20, (Math.random()-0.5)*shake*20);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#122512'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  if(m.type === 'maze') ws.dots.forEach(d => { if(d.active) { ctx.fillStyle = '#44ff44'; ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI*2); ctx.fill(); }});
  obs.forEach(o => { ctx.font = '45px Arial'; ctx.textAlign = 'center'; ctx.fillText(o.id==='modtoe'?'🦶':o.id==='acer'?'🕵️‍♂️':'👾', o.x, o.y+15); });

  ctx.save(); ctx.translate(sqX, sqY);
  if (inv > 0 && Math.floor(ts / 100) % 2 === 0) ctx.globalAlpha = 0.3;
  ctx.fillStyle = m.col; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 9, 30, 5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.ellipse(0, 0, 25, 34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore(); ctx.restore();

  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('dc').textContent = Math.floor(dist) + 'm';
  if(state === 'active') requestAnimationFrame(loop);
  else if(state === 'over') { document.getElementById('gs').style.display='flex'; document.getElementById('final-stats').textContent=Math.floor(score); }
}
</script>
</body>
</html>
