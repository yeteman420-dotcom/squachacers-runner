<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SquachAcers: Universe Shifter 19X</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-bright: #FFD700;
    --red: #ff3333;
    --neon: #44ff44;
    --ortho-cyan: #00ffff;
    --tactical-green: #1a331a;
    --bg-void: #010101;
    --ui-glow: rgba(68, 255, 68, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

  body {
    background-color: #000;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    user-select: none;
    touch-action: none;
  }

  #gc {
    position: relative;
    width: min(500px, 100vw);
    height: min(700px, 100vh);
    background-color: var(--bg-void);
    border: 1px solid var(--tactical-green);
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,1), 0 0 25px var(--ui-glow);
  }

  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }

  /* --- HUD SYSTEM --- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    pointer-events: none;
    z-index: 100;
  }

  .hb {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.65);
    padding: 8px 14px;
    border: 1px solid rgba(68, 255, 68, 0.2);
    border-radius: 2px;
    min-width: 95px;
    backdrop-filter: blur(8px);
  }

  .hl { font-family: 'Black Ops One', cursive; font-size: 10px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .hv { font-family: 'Black Ops One', cursive; font-size: 26px; color: #fff; text-shadow: 0 0 10px var(--gold); }

  /* --- SCREEN INTERFACE --- */
  .system-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 40px;
    text-align: center;
    background: rgba(0,0,0,0.96);
    backdrop-filter: blur(12px);
  }

  #ss { background: radial-gradient(circle at center, #0a220a 0%, #000 100%); }

  .logo {
    font-family: 'Black Ops One', cursive;
    font-size: 46px;
    color: var(--neon);
    text-shadow: 0 0 35px #1a5e1a;
    letter-spacing: 6px;
    margin-bottom: 5px;
  }

  .sub { font-family: 'Black Ops One', cursive; font-size: 14px; color: #666; letter-spacing: 8px; margin-bottom: 35px; }

  .btn {
    font-family: 'Black Ops One', cursive;
    font-size: 20px;
    letter-spacing: 4px;
    padding: 20px 55px;
    border: 2px solid var(--neon);
    background: transparent;
    color: var(--neon);
    cursor: pointer;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    margin-top: 25px;
  }

  .btn:active { transform: scale(0.94); }
  .btn:hover { background: rgba(68, 255, 68, 0.1); box-shadow: 0 0 30px var(--neon); }

  #mode-banner {
    position: absolute;
    top: 85px;
    width: 100%;
    text-align: center;
    font-family: 'Black Ops One', cursive;
    font-size: 14px;
    letter-spacing: 6px;
    z-index: 150;
    color: var(--neon);
    text-shadow: 0 0 10px #000;
  }

  #integrity-meter {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 150;
    background: rgba(0,0,0,0.55);
    padding: 10px 22px;
    border-radius: 40px;
    border: 1px solid rgba(68, 255, 68, 0.25);
  }

  .notification {
    position: absolute;
    font-family: 'Black Ops One', cursive;
    font-size: 22px;
    color: var(--neon);
    pointer-events: none;
    z-index: 500;
    animation: viralPop 1.2s ease-out forwards;
    text-shadow: 0 0 15px #000;
  }

  @keyframes viralPop {
    0% { opacity: 0; transform: translateY(30px) scale(0.6); }
    20% { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
  }
</style>
</head>
<body>

<div id="gc">
  <canvas id="c"></canvas>
  
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>

  <div id="mode-banner"></div>
  <div id="integrity-meter"></div>

  <div class="system-screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">19X MASTER GAME ENGINE</div>
    <div style="font-size: 85px; margin: 25px 0; filter: drop-shadow(0 0 20px #2e7d32);">🦶</div>
    <div style="color: #bbb; font-size: 13px; line-height: 2; margin-bottom: 30px; letter-spacing: 1px;">
      UNIVERSE SHIFTER ACTIVE<br>
      ALIGN MODTOES (THE FOOT LEVEL)<br>
      EVADE THE ACERS INVESTIGATORS
    </div>
    <button class="btn" onclick="initializeGame()">START ENGINE</button>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-top:10px;">BEST: <span id="best-score">0</span></div>
  </div>

  <div class="system-screen" id="gs" style="display:none;">
    <div style="font-family:'Black Ops One'; font-size:48px; color:var(--red); text-shadow: 0 0 25px #600;">SQUACH DOWN</div>
    <div class="sub" style="color:var(--red);">GAME OVER</div>
    <div id="final-stats" style="font-size: 65px; color: #fff; margin: 25px 0;">0</div>
    <button class="btn" onclick="initializeGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
/**
 * ============================================================================
 * UNIVERSE SHIFTER 19X MASTER GAME ENGINE
 * ============================================================================
 * Developer: Sonny (Matthew Stokes)
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 500, H = 700;
canvas.width = W; canvas.height = H;

// --- DYNAMIC STATE ---
let state = 'standby';
let score = 0, dist = 0, wave = 1, lives = 5, inv = 0;
let sqX = W/2, sqY = H-140, txS = W/2, lastT = 0, waveT = 0, gameTime = 0;
let shake = 0, gunCD = 0, holding = false;
let obs = [], beams = [], parts = [], rings = [], ws = {};

const WAVE_DURATION = 35;
const hiScore = parseInt(localStorage.getItem('sq_hs')||'0');

// --- UNIVERSE SHIFTER MODES ---
const MODES = [
  { id:'modtoes', name:'MODTOE ALIGNMENT', col:'#44ff44', icon:'🦶', desc:'FOOT LEVEL: SLOT THE MODULES', type:'align' },
  { id:'creek',   name:'CRYPTID CREEK',    col:'#2e7d32', icon:'🕵️‍♂️', desc:'EVADE ACERS INVESTIGATORS', type:'frog' },
  { id:'space',   name:'SPACE RUNNER',     col:'#00ffff', icon:'🛸', desc:'DODGE ALIENS • TAP SHOOT', type:'dodge' },
  { id:'kong',    name:'SQUACH KONG',      col:'#ff8800', icon:'🦍', desc:'JUMP BARRELS • CLIMB', type:'jump' },
  { id:'runner',  name:'ENDLESS RUNNER',   col:'#ff00ff', icon:'🏃', desc:'SWIPE LANES • JUMP', type:'lane' },
  { id:'galaga',  name:'ACERS INVASION',   col:'#44aaff', icon:'👾', desc:'OBLITERATE FORMATIONS', type:'shoot' },
  { id:'asteroids',name:'UFO BELT',        col:'#ff4444', icon:'☄️', desc:'THRUST & ROTATE', type:'thrust' }
];

// --- AUDIO ENGINE ---
let AC = null, mPlay = false, mN = {};
function getAC(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }

function tone(f, tp, dur, vol = 0.2, delay = 0) {
  try {
    const ac = getAC(), o = ac.createOscillator(), g = ac.createGain();
    o.type = tp; o.frequency.setValueAtTime(f, ac.currentTime + delay);
    g.gain.setValueAtTime(vol, ac.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime + delay); o.stop(ac.currentTime + delay + dur + 0.05);
  } catch(e) {}
}

function sfxLaser() { tone(800, 'sawtooth', 0.1, 0.15); tone(1200, 'sine', 0.08, 0.1, 0.02); }
function sfxHit() { tone(120, 'triangle', 0.4, 0.4); }
function sfxPickup() { tone(880, 'sine', 0.1, 0.2); tone(1100, 'sine', 0.1, 0.2, 0.05); }
function sfxJump() { tone(350, 'sine', 0.15, 0.2); }
function sfxWave() { tone(200, 'square', 0.3, 0.2); tone(400, 'square', 0.3, 0.2, 0.15); }

// --- PROCEDURAL MUSIC ENGINE ---
const MUSIC = {
  modtoes:    {bass:[41,41,55,41], tempo:148, vol:0.11},
  creek:      {bass:[43,43,50,43], tempo:130, vol:0.10},
  spacerunner:{bass:[41,41,55,41], tempo:148, vol:0.11},
  donkeykong: {bass:[36,36,43,36], tempo:122, vol:0.12},
  galaga:     {bass:[38,38,50,38], tempo:140, vol:0.10}
};

function startMusic() {
  if (mPlay) return; const ac = getAC(); mPlay = true;
  const th = MUSIC[MODES[(wave-1)%MODES.length].id] || MUSIC.spacerunner;
  const step = 60/th.tempo/4; const mg = ac.createGain(); mg.gain.value = th.vol; mg.connect(ac.destination); mN.m = mg;
  let bs = 0, bt = ac.currentTime + 0.1;
  function doBass() {
    if (!mPlay) return;
    while (bt < ac.currentTime + 0.4) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = th.bass[bs%4];
      o.connect(g); g.connect(mg); g.gain.setValueAtTime(0.8, bt); g.gain.exponentialRampToValueAtTime(0.001, bt+step*1.8);
      o.start(bt); o.stop(bt+step*2); bs++; bt+=step*2;
    }
    mN.bT = setTimeout(doBass, 150);
  }
  doBass();
}

function stopMusic() { mPlay = false; clearTimeout(mN.bT); if(mN.m) try{ mN.m.gain.linearRampToValueAtTime(0, AC.currentTime+0.2); } catch(e){} mN={}; }

// --- INPUT HANDLERS ---
function mapInput(e) {
  const rect = canvas.getBoundingClientRect();
  const xPos = e.touches ? e.touches[0].clientX : e.clientX;
  txS = (xPos - rect.left) * (W / rect.width);
}
canvas.addEventListener('mousemove', mapInput);
canvas.addEventListener('touchmove', e => { e.preventDefault(); mapInput(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { 
  mapInput(e); 
  if (state === 'active') executeGameAction(); 
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') txS -= 50;
  if (e.key === 'ArrowRight') txS += 50;
  if (e.key === ' ' || e.key === 'ArrowUp') { holding = true; executeGameAction(); }
});
window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp') holding = false; });

function executeGameAction() {
  const m = MODES[(wave-1)%MODES.length];
  if (m.type === 'dodge' || m.type === 'shoot' || m.type === 'thrust') { beams.push({ x: sqX, y: sqY - 35, vy: -950 }); sfxLaser(); }
  if (m.type === 'jump' && ws.grounded) { ws.vy = -17; ws.grounded = false; sfxJump(); }
  if (m.type === 'frog') { ws.fy -= 75; sfxJump(); if(ws.fy < 95){ score+=1500; sfxPickup(); ws.fy=H-90; waveT=WAVE_DURATION; } }
}

// --- CORE LOOPS ---
function updateIntegrityUI() {
  const container = document.getElementById('integrity-meter'); container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span'); s.textContent = '🌲';
    s.style.fontSize = '26px'; s.style.opacity = i < lives ? '1' : '0.1';
    s.style.filter = i < lives ? 'drop-shadow(0 0 10px #4f4)' : 'none';
    container.appendChild(s);
  }
}

function initializeGame() {
  score = 0; wave = 1; lives = 5; dist = 0; waveT = 0; state = 'active';
  obs = []; beams = []; parts = []; rings = [];
  document.getElementById('ss').style.display = 'none';
  document.getElementById('gs').style.display = 'none';
  setupWave(); lastT = performance.now(); updateIntegrityUI(); requestAnimationFrame(masterLoop);
}

function setupWave() {
  const m = MODES[(wave - 1) % MODES.length];
  ws = { spawnTimer: 1.0, vy: 0, grounded: true, fy: H - 90, fx: W / 2 };
  document.getElementById('mode-banner').textContent = m.icon + " " + m.name;
  document.getElementById('mode-banner').style.color = m.col;
  document.getElementById('waveHud').textContent = wave;
  stopMusic(); setTimeout(() => { if (state === 'active') startMusic(); }, 350);
  sfxWave();
}

function takeGameDamage() {
  if (inv > 0) return; lives--; inv = 2.0; shake = 1.2; sfxHit(); updateIntegrityUI();
  if (lives <= 0) { state = 'over'; stopMusic(); document.getElementById('gs').style.display = 'flex'; document.getElementById('final-stats').textContent = Math.floor(score); }
}

function updatePhysics(dt) {
  const m = MODES[(wave - 1) % MODES.length];
  waveT += dt; gameTime += dt; dist += dt * 18;
  sqX += (txS - sqX) * 0.22; sqX = Math.max(35, Math.min(W - 35, sqX));

  ws.spawnTimer -= dt;
  if (ws.spawnTimer <= 0) {
    if (m.type === 'align') obs.push({ type: 'modtoe', x: Math.random()*(W-100)+50, y:-60, vy: 380 + (wave * 15) });
    else if (m.type === 'frog') obs.push({ type: 'acer', x: Math.random()*W, y:-60, vy: 500 });
    else if (m.id === 'kong') obs.push({ type: 'barrel', x: W + 60, y: H - 145, vx: -440 - (wave * 20) });
    else obs.push({ type: 'anom', x: Math.random()*W, y:-60, vy: 320 + (wave * 25) });
    ws.spawnTimer = Math.max(0.4, 0.95 - (wave * 0.1));
  }

  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i]; o.y += o.vy * dt || 0; o.x += o.vx * dt || 0;
    const tx = m.type === 'frog' ? ws.fx : sqX, ty = m.type === 'frog' ? ws.fy : sqY;
    if (Math.hypot(o.x - tx, o.y - ty) < 50) {
      if (o.type === 'modtoe') { score += 250; sfxPickup(); obs.splice(i, 1); }
      else if (inv <= 0) { takeGameDamage(); obs.splice(i, 1); }
    } else if (o.y > H + 50 || o.x < -120) {
      if (o.type === 'modtoe') takeGameDamage();
      obs.splice(i, 1);
    }
  }

  beams.forEach((b, i) => {
    b.y += b.vy * dt;
    obs.forEach((o, oi) => { if (o.type !== 'modtoe' && Math.hypot(b.x - o.x, b.y - o.y) < 45) { score += 100; obs.splice(oi, 1); beams.splice(i, 1); } });
    if (b.y < -50) beams.splice(i, 1);
  });

  if (m.type === 'jump' || m.type === 'lane') { ws.vy += 0.65; sqY += ws.vy; if (sqY > H-140) { sqY = H-140; ws.vy = 0; ws.grounded = true; } } else { sqY = H-140; }
  if (waveT >= WAVE_DURATION) { wave++; waveT = 0; setupWave(); }
  if (inv > 0) inv -= dt; if (shake > 0) shake -= dt * 4;
}

function drawGame(t) {
  ctx.save(); if (shake > 0) ctx.translate((Math.random()-0.5)*shake*15, (Math.random()-0.5)*shake*15);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  
  // Tactical Grid
  ctx.strokeStyle = '#122512'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const m = MODES[(wave - 1) % MODES.length];
  obs.forEach(o => {
    ctx.font = '45px Arial'; ctx.textAlign = 'center';
    let icon = o.type === 'modtoe' ? '🦶' : o.type === 'acer' ? '🕵️‍♂️' : o.type === 'barrel' ? '🛢️' : '👾';
    ctx.fillText(icon, o.x, o.y + 15);
  });

  beams.forEach(b => { ctx.fillStyle = '#0ff'; ctx.fillRect(b.x - 3, b.y, 6, 25); });

  // Player Rendering
  const px = m.type === 'frog' ? ws.fx : sqX, py = m.type === 'frog' ? ws.fy : sqY;
  ctx.save(); ctx.translate(px, py);
  if (inv > 0 && Math.floor(t * 12) % 2 === 0) ctx.globalAlpha = 0.25;
  ctx.fillStyle = m.col;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 9, 30, 5, 0, Math.PI * 2); ctx.fill(); }
  ctx.shadowBlur = 25; ctx.shadowColor = m.col;
  ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.ellipse(0, 0, 25, 34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(-8, -12, 4.5, 0, Math.PI * 2); ctx.arc(8, -12, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore(); ctx.restore();

  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('dc').textContent = Math.floor(dist) + 'm';
}

function masterLoop(ts) {
  if (state !== 'active') return;
  const dt = Math.min((ts - lastT) / 1000, 0.1); lastT = ts;
  updatePhysics(dt); drawGame(ts / 1000);
  requestAnimationFrame(masterLoop);
}

document.getElementById('best-score').textContent = hiScore;
</script>
</body>
</html>
