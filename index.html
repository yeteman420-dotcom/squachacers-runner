<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SquachAcers: Universe Shifter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-bright:#FFD700;--red:#ff3333;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Exo 2',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;touch-action:none;}
  #gc{position:relative;width:min(500px,100vw);height:min(700px,100vh);overflow:hidden;}
  canvas{width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;pointer-events:none;z-index:10;}
  .hb{display:flex;flex-direction:column;align-items:center;}
  .hl{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:0.7;}
  .hv{font-family:'Black Ops One',cursive;font-size:22px;color:#fff;text-shadow:0 0 10px var(--gold);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center;}
  #ss{background:radial-gradient(ellipse at center,#0a0015 0%,#000 100%);}
  #gs{background:rgba(0,0,10,0.97);display:none;overflow-y:auto;}
  .logo{font-family:'Black Ops One',cursive;font-size:36px;color:var(--gold-bright);text-shadow:0 0 30px var(--gold);letter-spacing:3px;margin-bottom:4px;}
  .sub{font-family:'Black Ops One',cursive;font-size:13px;color:#aaa;letter-spacing:5px;margin-bottom:18px;}
  .art{font-size:68px;margin:6px 0;animation:fly 2s ease-in-out infinite;}
  @keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-10px) rotate(5deg);}}
  .desc{font-size:11px;color:#777;letter-spacing:1px;margin-bottom:20px;line-height:2.0;}
  .btn{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:3px;padding:13px 36px;border:2px solid var(--gold);background:transparent;color:var(--gold-bright);cursor:pointer;transition:all 0.2s;}
  .btn:active{transform:scale(0.96);}
  .btn:hover{background:rgba(201,168,76,0.15);}
  .ot{font-family:'Black Ops One',cursive;font-size:40px;color:var(--red);text-shadow:0 0 30px var(--red);margin-bottom:6px;}
  .os{font-size:12px;color:#666;letter-spacing:3px;margin-bottom:14px;}
  .sd{font-family:'Black Ops One',cursive;font-size:48px;color:var(--gold-bright);text-shadow:0 0 20px var(--gold);margin-bottom:2px;}
  .sl{font-size:10px;letter-spacing:4px;color:#555;margin-bottom:14px;}
  .popup{position:absolute;font-family:'Black Ops One',cursive;font-size:16px;color:var(--gold-bright);pointer-events:none;animation:fu 0.9s ease-out forwards;z-index:30;text-shadow:0 0 8px var(--gold);}
  @keyframes fu{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-55px) scale(1.3);}}
  #trees-hud{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:25;pointer-events:none;background:rgba(0,0,0,0.45);padding:4px 14px 4px 10px;border-radius:20px;border:1px solid rgba(68,255,68,0.25);}
  #mode-banner{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Black Ops One',cursive;font-size:11px;letter-spacing:4px;z-index:15;pointer-events:none;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;margin-bottom:3px;font-family:'Black Ops One',cursive;font-size:12px;border-left:3px solid #333;background:rgba(255,255,255,0.03);}
  .lb-row.gold{border-color:#FFD700;background:rgba(255,215,0,0.08);}
  .lb-row.silver{border-color:#aaa;}
  .lb-row.bronze{border-color:#cd7f32;}
  .lbr{color:#C9A84C;width:22px;}.lbn{color:#fff;flex:1;padding:0 6px;}.lbs{color:#FFD700;}
  .lbt{font-family:'Black Ops One',cursive;font-size:9px;letter-spacing:4px;color:#C9A84C;text-align:center;margin-bottom:6px;opacity:0.8;}
  #ne{display:none;flex-direction:column;align-items:center;margin-bottom:12px;}
  #ni{font-family:'Black Ops One',cursive;font-size:16px;letter-spacing:3px;background:rgba(0,0,0,0.6);border:2px solid #C9A84C;color:#FFD700;padding:9px 14px;text-align:center;outline:none;width:210px;text-transform:uppercase;}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">DIST</div><div class="hv" id="dc">0m</div></div>
  </div>
  <div id="mode-banner"></div>
  <div id="trees-hud"></div>

  <div class="screen" id="ss" style="justify-content:flex-start;padding-top:22px;overflow-y:auto;">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">UNIVERSE SHIFTER</div>
    <div class="art">🦶</div>
    <div class="desc">
      <span style="color:#00ffff;">WAVE 1 → SPACE RUNNER</span><br>
      <span style="color:#ff8800;">WAVE 2 → DONKEY KONG</span><br>
      <span style="color:#ff00ff;">WAVE 3 → ENDLESS RUNNER</span><br>
      <span style="color:#00ffff;">WAVE 4 → GALAGA</span><br>
      <span style="color:#00ff88;">WAVE 5 → FLAPPY SQUACH</span><br>
      <span style="color:#ff4444;">WAVE 6 → ASTEROIDS</span><br>
      <span style="color:#FFD700;">WAVE 7 → FROGGER</span>
    </div>
    <button class="btn" id="startBtn">BLAST OFF</button>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-top:10px;">BEST: <span id="hsS">0</span></div>
    <div id="slb" style="width:100%;max-width:320px;margin-top:10px;"></div>
  </div>

  <div class="screen" id="gs">
    <div class="ot">OBLITERATED</div>
    <div class="os">SQUACH DOWN</div>
    <div class="sd" id="fs">0</div>
    <div class="sl">POINTS</div>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-bottom:12px;">BEST: <span id="hsG">0</span></div>
    <div id="ne">
      <div style="font-family:'Black Ops One',cursive;font-size:10px;letter-spacing:3px;color:#C9A84C;margin-bottom:8px;">NEW HIGH SCORE — ENTER NAME</div>
      <input id="ni" type="text" maxlength="12" placeholder="YOUR NAME">
      <button class="btn" id="saveBtn" style="margin-top:10px;padding:9px 24px;font-size:12px;">SAVE</button>
    </div>
    <div id="lb" style="width:100%;max-width:320px;margin-bottom:16px;"></div>
    <button class="btn" id="retryBtn">FLY AGAIN</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=500,H=700;
canvas.width=W;canvas.height=H;

// ── WAVE CONFIG ──────────────────────────────────────────────
const WAVE_MODES=[
  {id:'spacerunner',name:'SPACE RUNNER',   color:'#00ffff',icon:'🛸',desc:'← → DODGE  ·  TAP/SPACE SHOOT  ·  SWIPE UP ROLL'},
  {id:'donkeykong', name:'DONKEY KONG',    color:'#ff8800',icon:'🦍',desc:'← → MOVE  ·  TAP / SPACE TO JUMP  ·  DODGE BARRELS'},
  {id:'runner',     name:'ENDLESS RUNNER', color:'#ff00ff',icon:'🏃',desc:'← → LANES  ·  TAP/SPACE JUMP  ·  DOWN SLIDE'},
  {id:'galaga',     name:'GALAGA',         color:'#00ffff',icon:'👾',desc:'← → MOVE  ·  AUTO FIRE  ·  DODGE FORMATIONS'},
  {id:'flappy',     name:'FLAPPY SQUACH',  color:'#00ff88',icon:'🐦',desc:'TAP / SPACE TO FLAP  ·  AVOID THE PIPES'},
  {id:'asteroids',  name:'ASTEROIDS',      color:'#ff4444',icon:'☄️', desc:'← → ROTATE  ·  UP THRUST  ·  TAP/SPACE FIRE'},
  {id:'frogger',    name:'FROGGER',        color:'#FFD700',icon:'🐸',desc:'← → ↑ ↓ HOP LANES  ·  REACH THE TOP'},
];
const WAVE_DUR=25;

// ── GLOBAL STATE ─────────────────────────────────────────────
let state='start',score=0,dist=0,hiScore=parseInt(localStorage.getItem('us2_hs')||'0');
let gameTime=0,wave=1,waveT=0,lives=5,maxLives=5,inv=0,shake=0;
let sqX=W/2,sqY=H-120,velX=0,velY=0;
let beams=[],obs=[],parts=[],rings=[];
let lastT=0,gunCD=0;
let txS=0,tyS=0,tmoved=false;
let waveBanner='',waveBannerT=0;
let rolling=false,rollA=0,rollDir=1,rollCD=0;
const ROLL_DUR=0.45,ROLL_CD=1.0,GUN_RATE=0.22;
let ws={};
let speed=200;

function getModeId(){return WAVE_MODES[Math.min(wave-1,WAVE_MODES.length-1)].id;}
function getMode(){return WAVE_MODES[Math.min(wave-1,WAVE_MODES.length-1)];}

// ── AUDIO ────────────────────────────────────────────────────
let AC=null,mN={},mPlay=false,muteBtn;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,tp,dur,vol=0.22,delay=0){try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=tp;o.frequency.setValueAtTime(f,ac.currentTime+delay);g.gain.setValueAtTime(0,ac.currentTime+delay);g.gain.linearRampToValueAtTime(vol,ac.currentTime+delay+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+delay+dur);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+0.05);}catch(e){}}
function noise(dur,vol,lpf=400){try{const ac=getAC(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.5);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lpf;s.buffer=buf;s.connect(f);f.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);s.start();s.stop(ac.currentTime+dur+0.05);}catch(e){}}
function sfxShoot(){tone(700,'sawtooth',0.04,0.18);tone(1100,'sine',0.03,0.1,0.02);}
function sfxHit(){noise(0.12,0.45,600);}
function sfxExplode(){noise(0.28,0.6,200);}
function sfxDie(){[350,250,160,80].forEach((f,i)=>tone(f,'sawtooth',0.35,0.4,i*0.18));}
function sfxPickup(){[700,900,1100].forEach((f,i)=>tone(f,'sine',0.1,0.22,i*0.06));}
function sfxJump(){tone(380,'sine',0.04,0.18);tone(580,'sine',0.05,0.12,0.03);}
function sfxWave(){[200,300,420,540].forEach((f,i)=>tone(f,'square',0.18,0.22,i*0.06));}
function sfxFlap(){tone(420,'triangle',0.04,0.22);tone(640,'triangle',0.03,0.13,0.02);}
function sfxLane(){tone(350,'sine',0.05,0.1);}

const MUSIC={
  spacerunner:{b:[41,41,55,41,49,41,55,49],a:[311,392,466,554,466,392,311,261,294,370,440,523,440,370,294,247],t:148},
  donkeykong: {b:[36,36,43,36,41,36,43,41],a:[261,330,392,523,392,330,261,220,247,311,370,494,370,311,247,208],t:120},
  runner:     {b:[45,45,52,45,48,45,52,48],a:[349,440,523,698,523,440,349,294,330,415,494,659,494,415,330,277],t:160},
  galaga:     {b:[38,38,50,38,45,38,50,45],a:[277,370,440,554,440,370,277,233,262,349,415,523,415,349,262,220],t:140},
  flappy:     {b:[48,48,55,48,53,48,55,53],a:[392,494,587,784,587,494,392,330,370,466,554,740,554,466,370,311],t:110},
  asteroids:  {b:[33,33,45,33,40,33,45,40],a:[220,277,349,466,349,277,220,185,208,262,330,440,330,262,208,175],t:170},
  frogger:    {b:[43,43,50,43,48,43,50,48],a:[330,415,494,659,494,415,330,277,311,392,466,622,466,392,311,262],t:130},
};
function startMusic(){
  if(mPlay)return;const ac=getAC();mPlay=true;
  const th=MUSIC[getModeId()]||MUSIC.spacerunner;
  const step=60/th.t/4;
  const mg=ac.createGain();mg.gain.value=0.11;mg.connect(ac.destination);mN.m=mg;
  let bs=0,bt=ac.currentTime+0.1;
  function sB(){if(!mPlay)return;while(bt<ac.currentTime+0.4){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=320;o.type='sawtooth';o.frequency.value=th.b[bs%8];o.connect(f);f.connect(g);g.connect(mg);g.gain.setValueAtTime(0,bt);g.gain.linearRampToValueAtTime(0.8,bt+0.01);g.gain.exponentialRampToValueAtTime(0.001,bt+step*1.8);o.start(bt);o.stop(bt+step*2.2);bs++;bt+=step*2;}mN.bT=setTimeout(sB,150);}
  let as=0,at=ac.currentTime+0.1;
  function sA(){if(!mPlay)return;while(at<ac.currentTime+0.4){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=th.a[as%16];o.connect(g);g.connect(mg);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(0.14,at+0.005);g.gain.exponentialRampToValueAtTime(0.001,at+step*0.7);o.start(at);o.stop(at+step);as++;at+=step;}mN.aT=setTimeout(sA,150);}
  let kt=ac.currentTime+0.1;
  function sK(){if(!mPlay)return;while(kt<ac.currentTime+0.4){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(160,kt);o.frequency.exponentialRampToValueAtTime(38,kt+0.09);o.connect(g);g.connect(mg);g.gain.setValueAtTime(1.4,kt);g.gain.exponentialRampToValueAtTime(0.001,kt+0.24);o.start(kt);o.stop(kt+0.3);kt+=step*8;}mN.kT=setTimeout(sK,150);}
  sB();sA();sK();
}
function stopMusic(){mPlay=false;['bT','aT','kT'].forEach(k=>clearTimeout(mN[k]));if(mN.m)try{mN.m.gain.linearRampToValueAtTime(0,AC.currentTime+0.2);}catch(e){}mN={};}
function toggleMute(){if(mPlay){stopMusic();muteBtn.textContent='🔇';}else{startMusic();muteBtn.textContent='🔊';}}

// ── PARTICLES ────────────────────────────────────────────────
function popup(x,y,val){const el=document.createElement('div');el.className='popup';el.textContent=typeof val==='number'?'+'+val:val;const rc=canvas.getBoundingClientRect();el.style.left=(rc.left+x*(rc.width/W))+'px';el.style.top=(rc.top+y*(rc.height/H))+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900);}
function spawnParts(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=60+Math.random()*150;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.6+Math.random()*0.9,size:2+Math.random()*4,color});}}
function spawnRing(x,y,color){rings.push({x,y,r:5,life:1,color});}
function updateTreesHud(){const h=document.getElementById('trees-hud');if(!h)return;h.innerHTML='';for(let i=0;i<maxLives;i++){const s=document.createElement('span');s.style.cssText=`font-size:22px;line-height:1;opacity:${i<lives?'1':'0.15'};filter:${i<lives?'drop-shadow(0 0 6px #44ff44)':'grayscale(1)'};transition:all 0.3s;`;s.textContent='🌲';h.appendChild(s);}}

// ── STARS ────────────────────────────────────────────────────
const STAR_COUNT=180;let warpStars=[];
function initStars(){warpStars=[];for(let i=0;i<STAR_COUNT;i++)warpStars.push(nStar(true));}
function nStar(rz=false){return{x:(Math.random()-0.5)*W*3,y:(Math.random()-0.5)*H*3,z:rz?Math.random()*W:W,col:Math.random()<0.06?`hsl(${Math.random()*60+180},80%,80%)`:'#fff'};}
initStars();
function updateStars(dt,spd){for(const s of warpStars){s.z-=spd*0.9*dt;if(s.z<=1)Object.assign(s,nStar(false));}}
function drawStars(spd){const cx=W/2,cy=H*0.45;for(const s of warpStars){const sx=(s.x/s.z)*W+cx,sy=(s.y/s.z)*H*0.7+cy;if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;const psz=Math.min(s.z+spd*0.9*0.016,W);const px=(s.x/psz)*W+cx,py=(s.y/psz)*H*0.7+cy;const br=Math.max(0,1-s.z/W),sz=Math.max(0.4,(1-s.z/W)*2.5);ctx.globalAlpha=br*0.85;if(br>0.3){ctx.strokeStyle=s.col;ctx.lineWidth=sz;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();}else{ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(sx,sy,Math.max(0.3,sz*0.5),0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;}

// ── INPUT ────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{
  if(keys[e.key])return;
  keys[e.key]=true;
  if(state!=='playing')return;
  if(e.key===' '){e.preventDefault();onAction();}
  if(e.key==='ArrowLeft')onLeft();
  if(e.key==='ArrowRight')onRight();
  if(e.key==='ArrowUp'){e.preventDefault();onUp();}
  if(e.key==='ArrowDown'){e.preventDefault();onDown();}
});
document.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='ArrowUp'&&getModeId()==='asteroids')ws.thrusting=false;if(e.key==='ArrowLeft'&&getModeId()==='asteroids')ws.rotVel=0;if(e.key==='ArrowRight'&&getModeId()==='asteroids')ws.rotVel=0;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(state!=='playing')return;txS=e.touches[0].clientX;tyS=e.touches[0].clientY;tmoved=false;},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();if(state!=='playing')return;
  const dx=e.touches[0].clientX-txS,dy=e.touches[0].clientY-tyS;
  if(!tmoved&&(Math.abs(dx)>16||Math.abs(dy)>16)){
    tmoved=true;
    if(Math.abs(dy)>Math.abs(dx)){if(dy<0)onUp();else onDown();}
    else{if(dx<0)onLeft();else onRight();}
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(state==='playing'&&!tmoved)onAction();},{passive:false});
canvas.addEventListener('click',()=>{if(state==='playing')onAction();});

function onAction(){
  const m=getModeId();
  if(m==='spacerunner'||m==='galaga')shoot();
  else if(m==='asteroids')shootAsteroids();
  else if(m==='donkeykong')dkJump();
  else if(m==='runner')runnerJump();
  else if(m==='flappy')doFlap();
  else if(m==='frogger')frogUp();
}
function onLeft(){
  const m=getModeId();
  if(m==='spacerunner'){velX-=420;sfxLane();}
  else if(m==='donkeykong'){ws.moveDir=-1;sfxLane();}
  else if(m==='runner')runnerLane(-1);
  else if(m==='galaga'){ws.galLeft=true;}
  else if(m==='asteroids'){ws.rotVel=-3.8;}
  else if(m==='frogger')frogLeft();
}
function onRight(){
  const m=getModeId();
  if(m==='spacerunner'){velX+=420;sfxLane();}
  else if(m==='donkeykong'){ws.moveDir=1;sfxLane();}
  else if(m==='runner')runnerLane(1);
  else if(m==='galaga'){ws.galRight=true;}
  else if(m==='asteroids'){ws.rotVel=3.8;}
  else if(m==='frogger')frogRight();
}
function onUp(){
  const m=getModeId();
  if(m==='spacerunner')doRoll();
  else if(m==='donkeykong')dkJump();
  else if(m==='runner')runnerJump();
  else if(m==='asteroids')ws.thrusting=true;
  else if(m==='frogger')frogUp();
  else if(m==='flappy')doFlap();
}
function onDown(){
  const m=getModeId();
  if(m==='runner')runnerSlide();
  else if(m==='asteroids')ws.thrusting=false;
  else if(m==='frogger')frogDown();
}

// ── SHARED ACTIONS ───────────────────────────────────────────
function doRoll(){if(rolling||rollCD>0)return;rolling=true;rollA=0;rollDir=sqX>W/2?-1:1;inv=Math.max(inv,ROLL_DUR+0.1);sfxJump();spawnParts(sqX,sqY,'#00ffff',8);}
function shoot(){if(gunCD>0)return;gunCD=GUN_RATE;sfxShoot();beams.push({x:sqX-18,y:sqY-10,vx:-4,vy:-700,age:0,col:'#00ffff'});beams.push({x:sqX+18,y:sqY-10,vx:4,vy:-700,age:0,col:'#00ffff'});}
function shootAsteroids(){if(gunCD>0)return;gunCD=0.2;sfxShoot();const ax=Math.cos((ws.angle||0)-Math.PI/2),ay=Math.sin((ws.angle||0)-Math.PI/2);beams.push({x:sqX+ax*25,y:sqY+ay*25,vx:ax*620,vy:ay*620,age:0,col:'#ff4444',life:1.2});}
function doFlap(){ws.vy=-380;sfxFlap();spawnParts(sqX,sqY,'#00ff88',5);}

// ── DONKEY KONG ───────────────────────────────────────────────
// 5 platforms zigzag, Squach runs left/right and jumps
function dkInit(){
  // Platforms: alternating left/right edges, stacked
  ws.platforms=[
    {x:0,   y:H-85, w:W,   h:16, col:'#964B00'}, // ground
    {x:80,  y:560,  w:340, h:14, col:'#7a3d00'},
    {x:0,   y:450,  w:340, h:14, col:'#7a3d00'},
    {x:80,  y:340,  w:340, h:14, col:'#7a3d00'},
    {x:0,   y:230,  w:340, h:14, col:'#7a3d00'},
    {x:80,  y:125,  w:340, h:14, col:'#7a3d00'},
  ];
  // Ladders connecting platforms
  ws.ladders=[
    {x:380,y:560,h:H-85-560},
    {x:40, y:450,h:560-450},
    {x:380,y:340,h:450-340},
    {x:40, y:230,h:340-230},
    {x:380,y:125,h:230-125},
  ];
  sqX=60;sqY=H-85-40;velX=0;velY=0;
  ws.vy=0;ws.onGround=true;ws.moveDir=0;ws.barrelT=2.8;
  ws.barrels=[];
}
function dkJump(){
  if(!ws.onGround)return;
  ws.vy=-520;ws.onGround=false;sfxJump();spawnParts(sqX,sqY,'#C9A84C',6);
}
function updateDK(dt){
  // Horizontal movement
  if(ws.moveDir!==0||keys['ArrowLeft']||keys['ArrowRight']){
    const dir=(keys['ArrowLeft']?-1:0)+(keys['ArrowRight']?1:0)||(ws.moveDir||0);
    sqX+=dir*200*dt;
    ws.moveDir=0;
  }
  sqX=Math.max(20,Math.min(W-20,sqX));

  // Gravity
  ws.vy+=780*dt;
  sqY+=ws.vy*dt;
  ws.onGround=false;

  // Platform collision (only landing on top)
  for(const p of ws.platforms){
    const foot=sqY+28;
    if(sqX>p.x&&sqX<p.x+p.w&&foot>=p.y&&foot<=p.y+p.h+Math.abs(ws.vy)*dt+4&&ws.vy>=0){
      sqY=p.y-28;ws.vy=0;ws.onGround=true;break;
    }
  }
  // Fall off bottom → lose life
  if(sqY>H+20){lives--;inv=1;shake=0.8;sfxHit();sqX=60;sqY=H-85-40;ws.vy=0;updateTreesHud();if(lives<=0){gameOver();return;}}

  // Spawn barrels
  ws.barrelT-=dt;
  if(ws.barrelT<=0){
    ws.barrels.push({x:W-60,y:ws.platforms[ws.platforms.length-1].y-20,vy:0,vx:-(100+wave*15),floor:ws.platforms.length-1,size:20,hp:1,maxHp:1,score:50,col:'#964B00'});
    ws.barrelT=Math.max(1.0,3.0-wave*0.22)*(0.5+Math.random()*0.8);
  }

  // Update barrels
  for(let i=ws.barrels.length-1;i>=0;i--){
    const b=ws.barrels[i];
    b.x+=b.vx*dt;
    b.vy+=600*dt;
    b.y+=b.vy*dt;

    // Check each platform for landing
    for(let pi=0;pi<ws.platforms.length;pi++){
      const p=ws.platforms[pi];
      const foot=b.y+b.size;
      if(b.x>p.x&&b.x<p.x+p.w&&foot>=p.y&&foot<=p.y+28&&b.vy>=0){
        b.y=p.y-b.size;b.vy=-80; // small bounce
        // reverse direction at platform edges
        if(b.x<=p.x+30)b.vx=Math.abs(b.vx);
        if(b.x>=p.x+p.w-30)b.vx=-Math.abs(b.vx);
        break;
      }
    }
    // Off screen
    if(b.x<-40||b.x>W+40||b.y>H+40){ws.barrels.splice(i,1);continue;}

    // Beam hit
    let hit=false;
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-b.x,beams[j].y-b.y)<b.size+6){
        sfxHit();score+=b.score;popup(b.x,b.y,b.score);spawnParts(b.x,b.y,'#ff8800',12);spawnRing(b.x,b.y,'#ff8800');ws.barrels.splice(i,1);beams.splice(j,1);hit=true;break;
      }
    }
    if(hit)continue;

    // Hit squach
    if(inv<=0&&Math.hypot(b.x-sqX,b.y-sqY)<b.size+16){lives--;inv=1.5;shake=1;sfxHit();spawnParts(sqX,sqY,'#ff3333',18);spawnRing(sqX,sqY,'#ff3333');updateTreesHud();if(lives<=0){gameOver();return;}}
  }
}

// ── ENDLESS RUNNER ────────────────────────────────────────────
// Only 2 lanes: center and right. Obstacles scroll from top.
const RUN_LANES=[W/2-20, W*0.78]; // center, right
function runnerInit(){
  ws.lane=0; // start center
  ws.ry=H-100; ws.rvy=0; ws.onGround=true; ws.sliding=false; ws.slideT=0;
  ws.obstacleT=1.8;
  sqX=RUN_LANES[0]; sqY=ws.ry;
}
function runnerLane(dir){
  const newL=Math.max(0,Math.min(RUN_LANES.length-1,(ws.lane||0)+dir));
  if(newL!==(ws.lane||0)){ws.lane=newL;sfxLane();}
}
function runnerJump(){
  if(!ws.onGround||ws.sliding)return;
  ws.rvy=-530;ws.onGround=false;sfxJump();spawnParts(sqX,sqY,'#ff00ff',6);
}
function runnerSlide(){
  if(!ws.onGround)return;
  ws.sliding=true;ws.slideT=0.55;sfxLane();
}
function updateRunner(dt){
  // Smooth lane snap
  const targX=RUN_LANES[ws.lane||0];
  sqX+=(targX-sqX)*Math.min(1,dt*16);

  // Gravity
  ws.rvy+=880*dt;
  ws.ry+=ws.rvy*dt;
  if(ws.ry>=H-100){ws.ry=H-100;ws.rvy=0;ws.onGround=true;}else ws.onGround=false;
  sqY=ws.ry;

  // Slide timer
  if(ws.sliding){ws.slideT-=dt;if(ws.slideT<=0)ws.sliding=false;}

  // Spawn
  ws.obstacleT-=dt;
  if(ws.obstacleT<=0){
    const lane=Math.floor(Math.random()*RUN_LANES.length);
    const types=['low','high','coin'];
    const t=Math.random()<0.3?'coin':Math.random()<0.5?'low':'high';
    obs.push({type:'runob',sub:t,x:RUN_LANES[lane],y:-50,vy:300+wave*22,size:t==='high'?44:t==='low'?24:16,col:t==='coin'?'#FFD700':t==='low'?'#ff4400':'#aa00ff',hp:1,maxHp:1,score:t==='coin'?50:30,wobble:0});
    ws.obstacleT=Math.max(0.7,2.0-wave*0.1)*(0.5+Math.random()*0.85);
  }

  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.y+=o.vy*dt;
    if(o.y>H+60){obs.splice(i,1);continue;}
    // Beam hit
    let bHit=false;
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-o.x,beams[j].y-o.y)<o.size+5){
        o.hp--;sfxHit();spawnParts(beams[j].x,beams[j].y,o.col,6);beams.splice(j,1);
        if(o.hp<=0){sfxExplode();spawnParts(o.x,o.y,o.col,14);spawnRing(o.x,o.y,o.col);score+=o.score;popup(o.x,o.y,o.score);obs.splice(i,1);}
        bHit=true;break;
      }
    }
    if(bHit)continue;
    if(inv>0)continue;
    const xDist=Math.abs(o.x-sqX);
    const yDist=Math.abs(o.y-sqY);
    const slideOk=ws.sliding&&o.sub==='low';
    const jumpOk=!ws.onGround&&o.sub==='low';
    if(!slideOk&&!jumpOk&&xDist<(o.sub==='high'?38:28)&&yDist<(o.sub==='high'?50:30)){
      if(o.sub==='coin'){score+=o.score;popup(o.x,o.y,o.score);sfxPickup();spawnParts(o.x,o.y,'#FFD700',10);obs.splice(i,1);}
      else{lives--;inv=1.5;shake=0.9;sfxHit();spawnParts(sqX,sqY,'#ff3333',18);spawnRing(sqX,sqY,'#ff3333');obs.splice(i,1);updateTreesHud();if(lives<=0){gameOver();return;}}
    }
  }
}

// ── GALAGA ────────────────────────────────────────────────────
function galagaInit(){
  sqX=W/2;sqY=H-100;velX=0;
  ws.galLeft=false;ws.galRight=false;
  ws.formation=[];ws.swoopQueue=[];ws.shootT=1.5;ws.phase=0;
  ws.autoFireT=0.28;
  buildFormation();
}
function buildFormation(){
  ws.formation=[];
  const rows=Math.min(2+Math.floor(wave/2),4),cols=7;
  const types=[{t:'grunt',hp:1,size:10,col:'#ff2288',sc:80},{t:'mid',hp:1,size:14,col:'#44ff88',sc:50},{t:'heavy',hp:2,size:18,col:'#ff8800',sc:120},{t:'boss',hp:3,size:22,col:'#ffcc00',sc:200}];
  for(let r=0;r<rows;r++){
    const td=types[Math.min(r,3)];
    for(let c=0;c<cols;c++){
      ws.formation.push({x:50+c*62,y:65+r*52,bx:50+c*62,by:65+r*52,hp:td.hp,maxHp:td.hp,size:td.size,col:td.t==='boss'?'#ffcc00':td.col,score:td.sc,alive:true,swoop:false,swoopT:0,swoopSX:0,swoopSY:0,swoopDir:1});
    }
  }
}
function updateGalaga(dt){
  // Ship movement — smooth
  if(ws.galLeft||keys['ArrowLeft'])velX-=600*dt;
  if(ws.galRight||keys['ArrowRight'])velX+=600*dt;
  ws.galLeft=false;ws.galRight=false;
  velX*=Math.pow(0.04,dt);
  sqX+=velX*dt;sqX=Math.max(22,Math.min(W-22,sqX));sqY=H-100;

  // Auto fire
  ws.autoFireT-=dt;if(ws.autoFireT<=0){shoot();ws.autoFireT=Math.max(0.18,0.32-wave*0.015);}

  // Formation sway
  ws.phase=(ws.phase||0)+dt*0.6;
  const sway=Math.sin(ws.phase)*25;

  const alive=ws.formation.filter(e=>e.alive);
  if(alive.length===0)buildFormation();

  // Random swooper
  ws.shootT-=dt;
  if(ws.shootT<=0&&alive.length>0){
    ws.shootT=Math.max(0.8,2.2-wave*0.15)*(0.5+Math.random()*0.8);
    const swoopers=alive.filter(e=>!e.swoop);
    if(swoopers.length>0){
      const e=swoopers[Math.floor(Math.random()*swoopers.length)];
      e.swoop=true;e.swoopT=0;e.swoopSX=e.x;e.swoopSY=e.y;e.swoopDir=Math.random()<0.5?1:-1;
      // Also fire a shot
      obs.push({type:'eshoot',x:e.x,y:e.y+e.size,vx:(sqX-e.x)*0.4,vy:260+wave*18,size:6,col:e.col,hp:1,maxHp:1,score:0,wobble:0});
    }
  }

  for(let i=ws.formation.length-1;i>=0;i--){
    const e=ws.formation[i];if(!e.alive)continue;
    if(e.swoop){
      e.swoopT+=dt;
      e.x=e.swoopSX+Math.sin(e.swoopT*2.5)*120*e.swoopDir;
      e.y=e.swoopSY+e.swoopT*220;
      if(e.y>H+40){e.swoop=false;e.x=e.bx;e.y=e.by;e.swoopT=0;}
    }else{
      e.x=e.bx+sway;e.y=e.by+Math.sin(ws.phase+i*0.4)*4;
    }
    // Beam hits
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-e.x,beams[j].y-e.y)<e.size+6){
        e.hp--;sfxHit();spawnParts(beams[j].x,beams[j].y,e.col,7);beams.splice(j,1);
        if(e.hp<=0){sfxExplode();spawnParts(e.x,e.y,e.col,18);spawnRing(e.x,e.y,e.col);score+=e.score;popup(e.x,e.y,e.score);e.alive=false;}
        break;
      }
    }
    // Hit player
    if(inv<=0&&Math.hypot(e.x-sqX,e.y-sqY)<e.size+14){lives--;inv=1.5;shake=1;sfxHit();spawnParts(sqX,sqY,'#ff3333',20);spawnRing(sqX,sqY,'#ff3333');e.alive=false;updateTreesHud();if(lives<=0){gameOver();return;}}
  }
  // Enemy shots
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.x+=(o.vx||0)*dt;o.y+=o.vy*dt;
    if(o.y>H+30||o.x<-20||o.x>W+20){obs.splice(i,1);continue;}
    // Beam deflect
    let bHit=false;
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-o.x,beams[j].y-o.y)<o.size+5){sfxHit();spawnParts(beams[j].x,beams[j].y,'#ffcc00',5);beams.splice(j,1);obs.splice(i,1);score+=5;bHit=true;break;}
    }
    if(bHit)continue;
    if(inv<=0&&Math.hypot(o.x-sqX,o.y-sqY)<o.size+12){lives--;inv=1.5;shake=0.9;sfxHit();spawnParts(sqX,sqY,'#ff3333',18);spawnRing(sqX,sqY,'#ff3333');obs.splice(i,1);updateTreesHud();if(lives<=0){gameOver();return;}}
  }
}

// ── FLAPPY SQUACH ─────────────────────────────────────────────
function flappyInit(){
  sqX=110;sqY=H/2;ws.vy=0;ws.gravity=880;ws.pipeT=2.2;ws.pipeSpd=160+wave*16;
}
function updateFlappy(dt){
  ws.vy+=ws.gravity*dt;
  sqY+=ws.vy*dt;sqX=110;

  if(sqY<28){sqY=28;ws.vy=Math.max(0,ws.vy);}
  if(sqY>H-50){lives--;inv=0.3;shake=1;sfxHit();spawnParts(sqX,sqY,'#ff3333',18);spawnRing(sqX,sqY,'#ff3333');sqY=H/2;ws.vy=0;updateTreesHud();if(lives<=0){gameOver();return;}}

  ws.pipeT-=dt;

    obs.push({type:'pipe',x:W+30,y:0,h:gY,col:'#228B22',pid,score:10,passed:false,hp:999});

    const inY=o.type==='pipe'?(sqY-18<o.h):(sqY+18>o.y);
    if(inX&&inY&&inv<=0){lives--;inv=1.5;shake=1.2;sfxHit();spawnParts(sqX,sqY,'#ff3333',20);spawnRing(sqX,sqY,'#ff3333');sqY=H/2;ws.vy=-100;updateTreesHud();if(lives<=0){gameOver();return;}}
  }
}

// ── ASTEROIDS ────────────────────────────────────────────────
function asteroidsInit(){
  ws.angle=0;ws.rotVel=0;ws.thrusting=false;ws.asteroids=[];ws.astT=1.5;
  sqX=W/2;sqY=H/2;velX=0;velY=0;
  for(let i=0;i<4+wave;i++){
    const a=Math.random()*Math.PI*2,d=130+Math.random()*150;
    spawnAst(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,40+Math.random()*28,3);
  }
}
function spawnAst(x,y,size,tier){
  const a=Math.random()*Math.PI*2,sp=25+Math.random()*55+tier*8;
  const pts=[];const n=6+Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){const ang=(i/n)*Math.PI*2;pts.push({x:Math.cos(ang)*size*(0.72+Math.random()*0.28),y:Math.sin(ang)*size*(0.72+Math.random()*0.28)});}
  ws.asteroids.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size,tier,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*1.8,pts,score:tier===3?20:tier===2?50:100});
}
function updateAsteroids(dt){
  if(ws.rotVel||(keys['ArrowLeft']||keys['ArrowRight'])){
    const rv=(keys['ArrowLeft']?-1:0)+(keys['ArrowRight']?1:0);
    ws.angle+=(rv?rv*3.8:ws.rotVel)*dt;
    if(!keys['ArrowLeft']&&!keys['ArrowRight'])ws.rotVel=0;
  }
  if(ws.thrusting||keys['ArrowUp']||keys['w']){
    velX+=Math.cos(ws.angle-Math.PI/2)*340*dt;velY+=Math.sin(ws.angle-Math.PI/2)*340*dt;
    spawnParts(sqX-Math.cos(ws.angle-Math.PI/2)*22,sqY-Math.sin(ws.angle-Math.PI/2)*22,'#ff6600',2);
  }
  const maxSpd=320;const spd=Math.hypot(velX,velY);if(spd>maxSpd){velX=velX/spd*maxSpd;velY=velY/spd*maxSpd;}
  velX*=Math.pow(0.22,dt);velY*=Math.pow(0.22,dt);
  sqX+=velX*dt;sqY+=velY*dt;
  if(sqX<0)sqX=W;if(sqX>W)sqX=0;if(sqY<0)sqY=H;if(sqY>H)sqY=0;

  ws.astT-=dt;
  if(ws.astT<=0&&ws.asteroids.length<12){
    const side=Math.floor(Math.random()*4);const ex=side===0?-40:side===1?W+40:Math.random()*W,ey=side===2?-40:side===3?H+40:Math.random()*H;
    spawnAst(ex,ey,38+Math.random()*20,Math.floor(Math.random()*3)+1);
    ws.astT=Math.max(1.2,3.5-wave*0.2);
  }

  for(let i=ws.asteroids.length-1;i>=0;i--){
    const a=ws.asteroids[i];
    a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.rotV*dt;
    if(a.x<-a.size)a.x=W+a.size;if(a.x>W+a.size)a.x=-a.size;
    if(a.y<-a.size)a.y=H+a.size;if(a.y>H+a.size)a.y=-a.size;
    let hit=false;
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-a.x,beams[j].y-a.y)<a.size+3){
        sfxHit();spawnParts(a.x,a.y,'#ff8800',12);score+=a.score;popup(a.x,a.y,a.score);
        if(a.size>18&&a.tier>1){spawnAst(a.x,a.y,a.size*0.55,a.tier-1);spawnAst(a.x,a.y,a.size*0.55,a.tier-1);}
        else sfxExplode();spawnRing(a.x,a.y,'#ff8800');
        ws.asteroids.splice(i,1);beams.splice(j,1);hit=true;break;
      }
    }
    if(hit)continue;
    if(inv<=0&&Math.hypot(a.x-sqX,a.y-sqY)<a.size+14){lives--;inv=2;shake=1;sfxHit();spawnParts(sqX,sqY,'#ff3333',22);spawnRing(sqX,sqY,'#ff3333');updateTreesHud();if(lives<=0){gameOver();return;}}
  }
}

// ── FROGGER ──────────────────────────────────────────────────
const FROG_ROWS=5;
function froggerInit(){
  ws.frogX=W/2;ws.frogY=H-75;ws.lanes=[];
  for(let i=0;i<FROG_ROWS;i++){
    const y=H-160-(i*(H-230)/FROG_ROWS);
    const dir=(i%2===0)?1:-1;
    const spd=75+wave*14+i*18;
    const cars=[];
    const gap=100+Math.random()*60;
    for(let c=0;c<3;c++)cars.push({x:c*(W/2.8+gap)*(dir>0?1:-1)+(dir<0?W:0),w:55+Math.random()*30,col:['#ff4444','#4466ff','#ffff00','#44ff44','#ff8800'][Math.floor(Math.random()*5)]});
    ws.lanes.push({y,dir,spd,cars});
  }
  sqX=ws.frogX;sqY=ws.frogY;
}
function frogUp(){ws.frogY=Math.max(75,ws.frogY-68);sfxJump();checkFrogTop();}
function frogDown(){ws.frogY=Math.min(H-75,ws.frogY+68);}
function frogLeft(){ws.frogX=Math.max(32,ws.frogX-70);sfxLane();}
function frogRight(){ws.frogX=Math.min(W-32,ws.frogX+70);sfxLane();}
function checkFrogTop(){if(ws.frogY<=95){score+=500;popup(ws.frogX,ws.frogY,'SAFE! +500');sfxPickup();spawnRing(ws.frogX,ws.frogY,'#FFD700');ws.frogX=W/2;ws.frogY=H-75;}}
function updateFrogger(dt){
  sqX=ws.frogX;sqY=ws.frogY;
  for(const lane of ws.lanes){
    for(const car of lane.cars){
      car.x+=lane.dir*lane.spd*dt;
      if(lane.dir>0&&car.x>W+car.w)car.x=-car.w-10;
      if(lane.dir<0&&car.x<-car.w-10)car.x=W+10;
      if(inv<=0&&ws.frogY>=lane.y-32&&ws.frogY<=lane.y+32&&ws.frogX+14>car.x&&ws.frogX-14<car.x+car.w){
        lives--;inv=1.5;shake=1;sfxHit();spawnParts(ws.frogX,ws.frogY,'#ff3333',20);spawnRing(ws.frogX,ws.frogY,'#ff3333');ws.frogX=W/2;ws.frogY=H-75;updateTreesHud();if(lives<=0){gameOver();return;}
      }
    }
  }
  if(keys['ArrowLeft'])frogLeft();
  if(keys['ArrowRight'])frogRight();
  if(keys['ArrowUp'])frogUp();
  if(keys['ArrowDown'])frogDown();
}

// ── SPACE RUNNER ─────────────────────────────────────────────
function spaceInit(){
  sqX=W/2;sqY=H-130;velX=0;ws.spawnT=1.5;
}
function updateSpace(dt){
  velX*=Math.pow(0.055,dt);sqX+=velX*dt;
  if(sqX<22){sqX=22;velX=Math.abs(velX)*0.3;}if(sqX>W-22){sqX=W-22;velX=-Math.abs(velX)*0.3;}
  sqY=H-130;
  if(rolling){rollA+=dt*(Math.PI*2/ROLL_DUR);if(rollA>=Math.PI*2){rolling=false;rollA=0;rollCD=ROLL_CD;}}
  if(rollCD>0)rollCD-=dt;

  ws.spawnT-=dt;
  if(ws.spawnT<=0){
    const lx=[90,W/2,W-90];const l=Math.floor(Math.random()*3);const sz=18+Math.random()*18;
    obs.push({type:'alien',x:lx[l]+Math.random()*50-25,y:-40,vy:210+wave*22,size:sz,hp:1+Math.floor(wave/3),maxHp:1+Math.floor(wave/3),col:'#ff2288',score:80+wave*10,wobble:Math.random()*Math.PI*2});
    ws.spawnT=Math.max(0.7,2.4-wave*0.13)*(0.5+Math.random()*0.8);
  }
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.y+=o.vy*dt;if(o.wobble!==undefined)o.wobble+=dt;
    if(o.y>H+60){obs.splice(i,1);continue;}
    let bHit=false;
    for(let j=beams.length-1;j>=0;j--){
      if(Math.hypot(beams[j].x-o.x,beams[j].y-o.y)<o.size+5){
        o.hp--;sfxHit();spawnParts(beams[j].x,beams[j].y,o.col,7);beams.splice(j,1);
        if(o.hp<=0){sfxExplode();spawnParts(o.x,o.y,o.col,20);spawnRing(o.x,o.y,o.col);score+=o.score;popup(o.x,o.y,o.score);obs.splice(i,1);}
        bHit=true;break;
      }
    }
    if(bHit)continue;
    if(inv<=0&&Math.hypot(o.x-sqX,o.y-sqY)<o.size+14){lives--;inv=1.5;shake=0.9;sfxHit();spawnParts(sqX,sqY,'#ff3333',20);spawnRing(sqX,sqY,'#ff3333');obs.splice(i,1);updateTreesHud();if(lives<=0){gameOver();return;}}
  }
}

// ── WAVE INIT ─────────────────────────────────────────────────
function initWave(){
  obs=[];beams=[];parts=[];rings=[];ws={};waveT=0;
  const m=getModeId();
  if(m==='spacerunner')spaceInit();
  else if(m==='donkeykong')dkInit();
  else if(m==='runner')runnerInit();
  else if(m==='galaga')galagaInit();
  else if(m==='flappy')flappyInit();
  else if(m==='asteroids')asteroidsInit();
  else if(m==='frogger')froggerInit();
  const md=getMode();
  const banner=document.getElementById('mode-banner');
  if(banner){banner.textContent=md.name;banner.style.color=md.color;}
  document.getElementById('waveHud').textContent=wave;
}
function nextWave(){
  wave++;waveT=0;
  const md=getMode();
  waveBanner=md.icon+' '+md.name;waveBannerT=3.2;
  sfxWave();sfxWave();
  stopMusic();setTimeout(()=>{if(state==='playing')startMusic();},450);
  initWave();
  lives=Math.min(maxLives,lives+1);updateTreesHud();
  popup(W/2,H/2-40,`WAVE ${wave}!`);
}

// ── MAIN UPDATE ───────────────────────────────────────────────
function update(dt,t){
  if(isNaN(dt)||dt>0.1)dt=0.016;
  gameTime+=dt;waveT+=dt;
  dist+=speed*dt/10;speed=Math.min(420,160+gameTime*3+wave*10);
  if(waveBannerT>0)waveBannerT-=dt;
  if(gunCD>0)gunCD-=dt;
  if(inv>0)inv-=dt;
  if(shake>0)shake-=dt*5;
  if(waveT>=WAVE_DUR)nextWave();

  const m=getModeId();
  if(m==='spacerunner')updateSpace(dt);
  else if(m==='donkeykong')updateDK(dt);
  else if(m==='runner')updateRunner(dt);
  else if(m==='galaga')updateGalaga(dt);
  else if(m==='flappy')updateFlappy(dt);
  else if(m==='asteroids')updateAsteroids(dt);
  else if(m==='frogger')updateFrogger(dt);

  // Passive beam cleanup
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;if(b.life!==undefined)b.life-=dt;if(b.y<-60||b.x<-60||b.x>W+60||b.y>H+60||(b.life!==undefined&&b.life<=0))beams.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=50*dt;p.life-=p.decay*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=140*dt;r.life-=dt*2.5;if(r.life<=0)rings.splice(i,1);}
  updateStars(dt,speed);
  score+=dt*wave*1.5;
  document.getElementById('sc').textContent=Math.floor(score);
  document.getElementById('dc').textContent=Math.floor(dist)+'m';
}

// ── DRAW ─────────────────────────────────────────────────────
function drawBg(t){
  const m=getModeId();
  const md=getMode();
  if(m==='spacerunner'||m==='galaga'||m==='asteroids'){
    ctx.fillStyle=m==='asteroids'?'#000004':m==='galaga'?'#000010':'#000008';
    ctx.fillRect(0,0,W,H);
    drawStars(m==='asteroids'?60:speed);
    if(m==='galaga'){ctx.strokeStyle='rgba(0,255,255,0.035)';ctx.lineWidth=1;for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
  }
  else if(m==='donkeykong'){
    ctx.fillStyle='#130800';ctx.fillRect(0,0,W,H);
    // Scaffold bg
    ctx.strokeStyle='rgba(100,50,0,0.18)';ctx.lineWidth=1;
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // Draw platforms
    ws.platforms&&ws.platforms.forEach((p,i)=>{
      const grad=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
      grad.addColorStop(0,'#c26a10');grad.addColorStop(1,'#7a3d00');
      ctx.fillStyle=grad;ctx.shadowBlur=8;ctx.shadowColor='#ff8800';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='rgba(255,200,100,0.35)';ctx.fillRect(p.x,p.y,p.w,3);
      ctx.shadowBlur=0;
      // Platform bolts
      for(let bx=p.x+20;bx<p.x+p.w-10;bx+=60){ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(bx,p.y+7,3,0,Math.PI*2);ctx.fill();}
    });
    // Ladders
    ws.ladders&&ws.ladders.forEach(l=>{ctx.strokeStyle='#ff8800';ctx.lineWidth=4;ctx.globalAlpha=0.5;ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+l.h);ctx.stroke();for(let ry=l.y;ry<l.y+l.h;ry+=14){ctx.beginPath();ctx.moveTo(l.x-8,ry);ctx.lineTo(l.x+8,ry);ctx.stroke();}ctx.globalAlpha=1;});
    // Gorilla
    ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦍',W-52,90);
    ctx.font='bold 10px "Black Ops One"';ctx.fillStyle='#ff8800';ctx.fillText('DESTROY THE BARRELS!',W/2,22);
  }
  else if(m==='runner'){
    ctx.fillStyle='#060010';ctx.fillRect(0,0,W,H);
    const gY=H-100;
    // City bg
    ctx.globalAlpha=0.22;for(let bx=0;bx<W;bx+=44){const bh=35+Math.sin(bx*0.7+t)*55;ctx.fillStyle='#1a0030';ctx.fillRect(bx,gY-bh,40,bh);const wc=bx%88===0?'#ff00ff':'#00ffff';ctx.fillStyle=wc;for(let wy=gY-bh+6;wy<gY-8;wy+=18){if(Math.random()<0.4){ctx.fillRect(bx+4,wy,8,10);}}}ctx.globalAlpha=1;
    // Ground
    ctx.fillStyle='#0d0018';ctx.fillRect(0,gY,W,H-gY);
    ctx.shadowBlur=18;ctx.shadowColor='#ff00ff';ctx.strokeStyle='#ff00ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,gY);ctx.lineTo(W,gY);ctx.stroke();ctx.shadowBlur=0;
    // Lane indicators
    RUN_LANES.forEach(lx=>{ctx.strokeStyle='rgba(255,0,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(lx,gY);ctx.lineTo(lx,0);ctx.stroke();ctx.setLineDash([]);});
  }
  else if(m==='flappy'){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5ba0d0');sky.addColorStop(0.7,'#a0d8f0');sky.addColorStop(1,'#c8eea0');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // Clouds
    ctx.fillStyle='rgba(255,255,255,0.82)';
    [[70+((t*22)%520)-20,55,45,22],[230+((t*18)%520)-100,95,55,20],[370+((t*25)%520)-200,40,38,16],[150+((t*15)%520)-80,155,42,18]].forEach(([cx,cy,rw,rh])=>{ctx.beginPath();ctx.ellipse(cx%W,cy,rw,rh,0,0,Math.PI*2);ctx.fill();});
    // Ground
    ctx.fillStyle='#7B3F00';ctx.fillRect(0,H-42,W,42);ctx.fillStyle='#A0522D';ctx.fillRect(0,H-42,W,10);
    // Grass
    ctx.fillStyle='#4a7c2f';ctx.fillRect(0,H-52,W,12);
  }
  else if(m==='frogger'){
    ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,H);
    // Safe zones
    ctx.fillStyle='#0d3d0d';ctx.fillRect(0,0,W,72);
    ctx.fillStyle='#0d3d0d';ctx.fillRect(0,H-68,W,68);
    ctx.fillStyle='#1a6e1a';ctx.fillRect(0,3,W,12);
    ctx.fillStyle='#1a6e1a';ctx.fillRect(0,H-68,W,12);
    // Lane rows
    ws.lanes&&ws.lanes.forEach((lane,i)=>{
      ctx.fillStyle=i%2===0?'#252525':'#1e1e1e';ctx.fillRect(0,lane.y-44,W,88);
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([15,15]);ctx.beginPath();ctx.moveTo(0,lane.y);ctx.lineTo(W,lane.y);ctx.stroke();ctx.setLineDash([]);
    });
    ctx.font='bold 12px "Black Ops One"';ctx.fillStyle='#FFD700';ctx.textAlign='center';ctx.fillText('🏁 REACH THE TOP — GAIN A LIFE!',W/2,40);
  }
}

function drawObstacles(t){
  const m=getModeId();
  // Donkey Kong barrels
  if(m==='donkeykong'&&ws.barrels){
    ws.barrels.forEach(b=>{
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(gameTime*4*Math.sign(b.vx||1));
      ctx.shadowBlur=14;ctx.shadowColor='#ff8800';
      const g=ctx.createRadialGradient(-4,-3,2,0,0,b.size);g.addColorStop(0,'#e07820');g.addColorStop(1,'#5a2500');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,b.size,b.size*0.7,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ff8800';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,b.size,b.size*0.7,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,180,60,0.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-b.size,0);ctx.lineTo(b.size,0);ctx.stroke();
      ctx.shadowBlur=0;ctx.restore();
    });
  }
  // Runner obstacles
  if(m==='runner'){
    obs.forEach(o=>{
      ctx.save();ctx.translate(o.x,o.y);ctx.shadowBlur=16;ctx.shadowColor=o.col;ctx.fillStyle=o.col;
      if(o.sub==='high'){ctx.fillRect(-22,-o.size,44,o.size*2);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(-22,-o.size,44,6);}
      else if(o.sub==='low'){ctx.fillRect(-22,-12,44,24);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(-22,-12,44,4);}
      else{ctx.beginPath();ctx.arc(0,0,o.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);}
      ctx.shadowBlur=0;ctx.restore();
    });
  }
  // Galaga formation
  if(m==='galaga'&&ws.formation){
    ws.formation.forEach(e=>{
      if(!e.alive)return;
      ctx.save();ctx.translate(e.x,e.y);ctx.shadowBlur=e.swoop?24:12;ctx.shadowColor=e.col;
      if(e.size<=11){// grunt
        ctx.fillStyle=e.col;ctx.beginPath();ctx.moveTo(0,-e.size*1.3);ctx.lineTo(e.size*0.5,e.size*0.7);ctx.lineTo(0,e.size*0.3);ctx.lineTo(-e.size*0.5,e.size*0.7);ctx.closePath();ctx.fill();
      }else if(e.size<=15){// mid
        ctx.fillStyle=e.col;ctx.beginPath();ctx.ellipse(0,0,e.size,e.size*0.32,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#aaffcc';ctx.beginPath();ctx.ellipse(0,-e.size*0.1,e.size*0.4,e.size*0.4,0,Math.PI,0);ctx.fill();
      }else{// heavy/boss
        ctx.fillStyle='#1a0000';ctx.beginPath();ctx.ellipse(0,0,e.size,e.size*0.42,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=e.col;ctx.beginPath();ctx.ellipse(0,0,e.size*0.78,e.size*0.26,0,0,Math.PI*2);ctx.fill();
        if(e.maxHp>1){const bw=e.size*2.2,r=e.hp/e.maxHp;ctx.shadowBlur=0;ctx.fillStyle='#111';ctx.fillRect(-bw/2,-e.size-9,bw,4);ctx.fillStyle=r>0.5?e.col:'#f44';ctx.fillRect(-bw/2,-e.size-9,bw*r,4);}
      }
      ctx.shadowBlur=0;ctx.restore();
    });
    obs.forEach(o=>{// enemy shots
      ctx.save();ctx.shadowBlur=12;ctx.shadowColor=o.col;ctx.fillStyle=o.col;ctx.beginPath();ctx.ellipse(o.x,o.y,o.size*0.5,o.size*1.4,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();
    });
  }
  // Flappy pipes
  if(m==='flappy'){
    obs.forEach(o=>{
      ctx.save();ctx.shadowBlur=8;ctx.shadowColor='#00aa00';ctx.fillStyle='#1e7a1e';
      if(o.type==='pipe'){
        ctx.fillRect(o.x,0,52,o.h);
        ctx.fillStyle='#155a15';ctx.fillRect(o.x-5,o.h-22,62,22);
        ctx.fillStyle='rgba(100,255,100,0.2)';ctx.fillRect(o.x+4,0,10,o.h);
      }else{
        ctx.fillRect(o.x,o.y,52,o.h);
        ctx.fillStyle='#155a15';ctx.fillRect(o.x-5,o.y,62,22);
        ctx.fillStyle='rgba(100,255,100,0.2)';ctx.fillRect(o.x+4,o.y+22,10,o.h-22);
      }
      ctx.shadowBlur=0;ctx.restore();
    });
  }
  // Frogger cars
  if(m==='frogger'&&ws.lanes){
    ws.lanes.forEach(lane=>{
      lane.cars.forEach(car=>{
        ctx.save();ctx.shadowBlur=10;ctx.shadowColor=car.col;ctx.fillStyle=car.col;
        ctx.beginPath();if(ctx.roundRect)ctx.roundRect(car.x,lane.y-20,car.w,40,8);else ctx.rect(car.x,lane.y-20,car.w,40);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(car.x+5,lane.y-15,car.w-10,16);
        ctx.fillStyle='#FFD700';ctx.shadowColor='#FFD700';ctx.shadowBlur=8;
        const hx=lane.dir>0?car.x+car.w+5:car.x-5;
        ctx.beginPath();ctx.arc(hx,lane.y-7,4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(hx,lane.y+7,4,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;ctx.restore();
      });
    });
  }
  // Space aliens
  if(m==='spacerunner'){
    obs.forEach(o=>{
      ctx.save();ctx.translate(o.x,o.y+Math.sin((o.wobble||0)+t*2.5)*3);
      ctx.shadowBlur=16;ctx.shadowColor=o.col;ctx.fillStyle=o.col;
      ctx.beginPath();ctx.moveTo(0,-o.size*1.35);ctx.lineTo(o.size*0.5,o.size*0.75);ctx.lineTo(0,o.size*0.3);ctx.lineTo(-o.size*0.5,o.size*0.75);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.shadowBlur=6;ctx.beginPath();ctx.ellipse(0,o.size*0.42,2.5,4,0,0,Math.PI*2);ctx.fill();
      if(o.maxHp>1){const bw=o.size*2.2,r=o.hp/o.maxHp;ctx.shadowBlur=0;ctx.fillStyle='#111';ctx.fillRect(-bw/2,-o.size-10,bw,4);ctx.fillStyle=r>0.5?'#f80':'#f44';ctx.fillRect(-bw/2,-o.size-10,bw*r,4);}
      ctx.shadowBlur=0;ctx.restore();
    });
  }
  // Asteroids
  if(m==='asteroids'&&ws.asteroids){
    ws.asteroids.forEach(a=>{
      ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
      ctx.shadowBlur=12;ctx.shadowColor='#ff6644';ctx.strokeStyle='#ff6644';ctx.lineWidth=2;ctx.fillStyle='#1a0800';
      ctx.beginPath();if(a.pts&&a.pts.length){ctx.moveTo(a.pts[0].x,a.pts[0].y);a.pts.forEach(p=>ctx.lineTo(p.x,p.y));}ctx.closePath();ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;ctx.restore();
    });
  }
}

function drawBeams(){
  beams.forEach(b=>{
    ctx.save();ctx.globalAlpha=Math.min(1,b.age*12);
    ctx.shadowBlur=18;ctx.shadowColor=b.col||'#00ffff';ctx.strokeStyle=b.col||'#00ffff';ctx.lineWidth=3;
    const mag=Math.hypot(b.vx||0,b.vy||-700)||700;const nx=(b.vx||0)/mag,ny=(b.vy||-700)/mag;
    const len=mag*0.042;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-nx*len,b.y-ny*len);ctx.stroke();
    ctx.fillStyle='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  });
}

function drawSquach(x,y,t,opts={}){
  const{tilt=0,glowCol='#C9A84C',scale=1,invincible=false}=opts;
  const flick=invincible&&Math.floor(t*15)%2===0;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.globalAlpha=flick?0.25:1;
  for(let i=0;i<8;i++){const a=(8-i)/8;ctx.globalAlpha=a*0.45*(flick?0.2:1);ctx.fillStyle=`hsl(${20+i*8},100%,${60-i*2}%)`;ctx.shadowBlur=5;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.ellipse(Math.sin(t*12+i)*2,14+i*4,3.2-i*0.2,2,0,0,Math.PI*2);ctx.fill();}
  ctx.shadowBlur=0;ctx.globalAlpha=flick?0.25:1;
  ctx.shadowBlur=12;ctx.shadowColor=glowCol;
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(0,2,14,19,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3522';ctx.beginPath();ctx.arc(0,-20,12,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=8;ctx.shadowColor='#FFD700';ctx.fillStyle='#FFD700';
  ctx.beginPath();ctx.arc(-4,-22,2.8,0,Math.PI*2);ctx.arc(4,-22,2.8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#3a2a1a';
  ctx.beginPath();ctx.ellipse(-19,3,8,4.5,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(19,3,8,4.5,-0.3,0,Math.PI*2);ctx.fill();
  const gc=gunCD>0?'#005555':'#00ffff';
  ctx.strokeStyle=gc;ctx.lineWidth=2.5;ctx.shadowBlur=8;ctx.shadowColor=gc;
  ctx.beginPath();ctx.moveTo(-24,2);ctx.lineTo(-24,-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,2);ctx.lineTo(24,-11);ctx.stroke();
  ctx.fillStyle=gc;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(-24,-11,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(24,-11,3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  if(invincible&&!flick){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#00ffff';ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor='#00ffff';ctx.globalAlpha=0.45+Math.sin(t*9)*0.3;ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.globalAlpha=1;}
}

function drawParticles(){
  parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowBlur=4;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;});
  rings.forEach(r=>{ctx.save();ctx.globalAlpha=r.life*0.4;ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor=r.color;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.restore();ctx.globalAlpha=1;});
}

function drawHUD(t){
  const m=getModeId();const md=getMode();
  // Wave banner
  if(waveBannerT>0){
    const a=Math.min(1,waveBannerT)*Math.min(1,waveBannerT/1.5);
    ctx.save();ctx.globalAlpha=a;ctx.font='bold 28px "Black Ops One",cursive';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=30;ctx.shadowColor=md.color;ctx.fillStyle=md.color;ctx.fillText(md.icon+' '+md.name,W/2-10,H/2-52);
    ctx.font='11px "Exo 2"';ctx.fillStyle='#aaa';ctx.shadowBlur=0;ctx.fillText(md.desc,W/2,H/2-24);
    ctx.restore();ctx.globalAlpha=1;
  }
  // Speed bar
  const pct=Math.min(1,(speed-160)/260);const bw=W-40;
  ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(20,H-21,bw,3);
  const g=ctx.createLinearGradient(20,0,20+bw,0);g.addColorStop(0,'#C9A84C');g.addColorStop(1,'#ff4444');
  ctx.fillStyle=g;ctx.fillRect(20,H-21,bw*pct,3);
  // Wave progress bar
  const wp=Math.min(1,waveT/WAVE_DUR);
  ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(0,H-26,W,3);
  ctx.fillStyle=md.color;ctx.globalAlpha=0.5;ctx.fillRect(0,H-26,W*(1-wp),3);ctx.globalAlpha=1;
  // Roll CD
  if(rollCD>0&&m==='spacerunner'){const rp=1-rollCD/ROLL_CD;ctx.fillStyle='rgba(0,255,255,0.1)';ctx.fillRect(0,H-30,W,3);ctx.fillStyle='#00ffff';ctx.fillRect(0,H-30,W*rp,3);}
  // Runner: show which lanes are active
  if(m==='runner'){ctx.font='9px "Exo 2"';ctx.fillStyle='rgba(255,0,255,0.5)';ctx.textAlign='center';ctx.fillText('CENTER   RIGHT',W/2,H-58);}
  // Controls hint (first 3s)
  if(waveT<3){const a=Math.max(0,(3-waveT)/3);ctx.save();ctx.globalAlpha=a*0.65;ctx.font='10px "Exo 2"';ctx.textAlign='center';ctx.fillStyle='#aaa';ctx.fillText(md.desc,W/2,H-62);ctx.restore();}
}

function draw(t){
  ctx.save();
  if(shake>0){const sh=shake*7;ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);}
  drawBg(t);
  drawObstacles(t);
  drawBeams();
  drawParticles();

  const m=getModeId();
  let sx=sqX,sy=sqY;
  if(m==='frogger'){sx=ws.frogX||W/2;sy=ws.frogY||H-75;}
  const glowMap={spacerunner:'#C9A84C',donkeykong:'#ff8800',runner:'#ff00ff',galaga:'#00ffff',flappy:'#00ff88',asteroids:'#ff4444',frogger:'#FFD700'};
  const gc=glowMap[m]||'#C9A84C';

  if(m==='asteroids'){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(ws.angle||0);drawSquach(0,0,t,{glowCol:gc,invincible:inv>0,tilt:0});ctx.restore();
  }else if(m==='flappy'){
    ctx.save();ctx.translate(sx,sy);const flapTilt=Math.max(-0.9,Math.min(1.3,(ws.vy||0)/450));ctx.rotate(flapTilt);drawSquach(0,0,t,{glowCol:gc,invincible:inv>0,tilt:0,scale:0.88});ctx.restore();
  }else if(m==='runner'&&ws.sliding){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(Math.PI*0.28);drawSquach(0,0,t,{glowCol:gc,invincible:inv>0,tilt:0,scale:0.72});ctx.restore();
  }else if(m==='donkeykong'&&rolling){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(rollA);drawSquach(0,0,t,{glowCol:gc,invincible:inv>0,tilt:0});ctx.restore();
  }else{
    const tilt=m==='spacerunner'?Math.max(-0.4,Math.min(0.4,velX*0.0005)):0;
    drawSquach(sx,sy,t,{glowCol:gc,invincible:inv>0,tilt});
  }
  drawHUD(t);
  ctx.restore();
}

// ── GAME FLOW ─────────────────────────────────────────────────
function getLocal(){try{return JSON.parse(localStorage.getItem('us2_sc')||'[]');}catch(e){return[];}}
function saveLocal(s){localStorage.setItem('us2_sc',JSON.stringify(s));}
function isHigh(s){const sc=getLocal();return sc.length<10||s>(sc[sc.length-1]?.score||0);}
function renderLB(id,hl=null){const sc=getLocal();const el=document.getElementById(id);if(!el)return;if(!sc.length){el.innerHTML='<div class="lbt" style="color:#333;">NO SCORES YET — BE FIRST</div>';return;}const ml=['gold','silver','bronze'];el.innerHTML='<div class="lbt">🏆 LOCAL BEST RUNS</div>'+sc.map((s,i)=>`<div class="lb-row ${ml[i]||'normal'}"><span class="lbr">${i===0?'👑':'#'+(i+1)}</span><span class="lbn">${s.name}</span><span class="lbs">${s.score.toLocaleString()}</span></div>`).join('');}

function gameOver(){
  state='gameover';stopMusic();sfxDie();
  if(score>hiScore){hiScore=score;localStorage.setItem('us2_hs',hiScore);}
  document.getElementById('fs').textContent=Math.floor(score).toLocaleString();
  document.getElementById('hsG').textContent=Math.floor(hiScore).toLocaleString();
  document.getElementById('gs').style.display='flex';
  const ne=document.getElementById('ne');
  if(isHigh(score)&&score>0){ne.style.display='flex';document.getElementById('ni').value='';setTimeout(()=>document.getElementById('ni').focus(),300);}
  else ne.style.display='none';
  renderLB('lb',score);
}
function submitScore(){
  const name=document.getElementById('ni').value.trim()||'ACER';
  const local=getLocal();local.push({name:name.toUpperCase(),score:Math.floor(score)});
  local.sort((a,b)=>b.score-a.score);saveLocal(local.slice(0,10));
  document.getElementById('ne').style.display='none';renderLB('lb',score);
}
function startGame(){
  score=0;dist=0;gameTime=0;speed=160;lives=5;maxLives=5;wave=1;
  sqX=W/2;sqY=H-120;velX=0;velY=0;
  beams=[];obs=[];parts=[];rings=[];
  inv=0;shake=0;rolling=false;rollA=0;rollCD=0;gunCD=0;
  waveBanner=WAVE_MODES[0].icon+' '+WAVE_MODES[0].name;waveBannerT=3;
  initStars();initWave();updateTreesHud();
  document.getElementById('ss').style.display='none';
  document.getElementById('gs').style.display='none';
  state='playing';startMusic();lastT=performance.now();
  requestAnimationFrame(loop);
}
function loop(ts){
  if(state!=='playing')return;
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  const t=ts/1000;update(dt,t);draw(t);
  requestAnimationFrame(loop);
}

// Title animation
(function tl(ts){if(state!=='start')return;updateStars(0.016,200);ctx.fillStyle='#000008';ctx.fillRect(0,0,W,H);drawStars(200);requestAnimationFrame(tl);})(0);

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('saveBtn').onclick=submitScore;
document.getElementById('ni').addEventListener('keydown',e=>{if(e.key==='Enter')submitScore();});
renderLB('slb');
document.getElementById('hsS').textContent=Math.floor(hiScore);

muteBtn=document.createElement('button');muteBtn.textContent='🔊';
muteBtn.style.cssText='position:absolute;top:10px;right:10px;z-index:50;background:rgba(0,0,0,0.6);border:1px solid #C9A84C;color:#FFD700;font-size:15px;padding:3px 8px;cursor:pointer;border-radius:4px;';
muteBtn.onclick=toggleMute;document.getElementById('gc').appendChild(muteBtn);
updateTreesHud();
</script>
