<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SquachAcers: Universe Shifter 19X Master</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-bright: #FFD700;
    --red: #ff3333;
    --neon: #44ff44;
    --ortho: #00ffff;
    --tactical-green: #1a331a;
    --bg-deep: #050505;
    --ui-border: rgba(68, 255, 68, 0.3);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  body {
    background-color: #000;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    user-select: none;
    touch-action: none;
  }

  #gc {
    position: relative;
    width: min(500px, 100vw);
    height: min(700px, 100vh);
    overflow: hidden;
    border: 1px solid var(--tactical-green);
    background-color: var(--bg-deep);
    box-shadow: inset 0 0 100px rgba(0,0,0,1), 0 0 30px rgba(68, 255, 68, 0.1);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  /* --- HUD ARCHITECTURE --- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 15px 20px 0;
    pointer-events: none;
    z-index: 100;
  }

  .hb {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.4);
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--ui-border);
  }

  .hl {
    font-family: 'Black Ops One', cursive;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .hv {
    font-family: 'Black Ops One', cursive;
    font-size: 24px;
    color: #fff;
    text-shadow: 0 0 10px var(--gold);
  }

  /* --- SCREEN UI --- */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 40px;
    text-align: center;
    background: rgba(0,0,0,0.94);
    backdrop-filter: blur(8px);
  }

  #ss {
    background: radial-gradient(circle at center, #0a1a0a 0%, #000 100%);
  }

  #gs {
    display: none;
    border-top: 4px solid var(--red);
  }

  .logo {
    font-family: 'Black Ops One', cursive;
    font-size: 48px;
    color: var(--neon);
    text-shadow: 0 0 40px #2e7d32;
    letter-spacing: 5px;
    margin-bottom: 10px;
  }

  .sub {
    font-family: 'Black Ops One', cursive;
    font-size: 16px;
    color: #777;
    letter-spacing: 8px;
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  .btn {
    font-family: 'Black Ops One', cursive;
    font-size: 20px;
    letter-spacing: 4px;
    padding: 18px 50px;
    border: 2px solid var(--neon);
    background: transparent;
    color: var(--neon);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    margin-top: 20px;
  }

  .btn:hover {
    background: rgba(68, 255, 68, 0.2);
    box-shadow: 0 0 30px rgba(68, 255, 68, 0.4);
    transform: scale(1.05);
  }

  #mode-banner {
    position: absolute;
    top: 75px;
    width: 100%;
    text-align: center;
    font-family: 'Black Ops One', cursive;
    font-size: 14px;
    letter-spacing: 6px;
    z-index: 150;
    color: var(--neon);
    text-shadow: 0 0 10px #000;
  }

  #trees-hud {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 150;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 30px;
    border: 1px solid var(--ui-border);
  }

  .popup {
    position: absolute;
    font-family: 'Black Ops One', cursive;
    font-size: 20px;
    color: var(--neon);
    pointer-events: none;
    z-index: 500;
    text-shadow: 0 0 10px #000;
    animation: viralPop 1.2s ease-out forwards;
  }

  @keyframes viralPop {
    0% { opacity: 0; transform: translateY(20px) scale(0.5); }
    20% { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }
</style>
</head>
<body>

<div id="gc">
  <canvas id="c"></canvas>
  
  <div id="hud">
    <div class="hb">
      <div class="hl">OBLITERATIONS</div>
      <div class="hv" id="sc">0</div>
    </div>
    <div class="hb">
      <div class="hl">WAVE</div>
      <div class="hv" id="waveHud">1</div>
    </div>
    <div class="hb">
      <div class="hl">GRID_SCAN</div>
      <div class="hv" id="dc">0m</div>
    </div>
  </div>

  <div id="mode-banner"></div>
  <div id="trees-hud"></div>

  <div class="screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="sub">19X MASTER BUILD</div>
    <div style="font-size: 80px; margin: 20px 0;">🦶</div>
    <div style="color: #bbb; font-size: 14px; line-height: 1.8; margin-bottom: 30px;">
      <span style="color: var(--neon);">SYSTEM: ORTHOSCAN AI ACTIVE</span><br>
      ALIGN MODTOE MODULES<br>
      EVADE ACERS INVESTIGATORS<br>
      OBLITERATE GRID ANOMALIES
    </div>
    <button class="btn" onclick="initializeScan()">BOOT SCANNER</button>
  </div>

  <div class="screen" id="gs">
    <div style="font-family:'Black Ops One'; font-size:48px; color:var(--red); text-shadow: 0 0 25px #600; margin-bottom: 10px;">SQUACH DOWN</div>
    <div class="sub">SYSTEM FAILURE</div>
    <div id="finalScore" style="font-size: 70px; color: #fff; margin-bottom: 20px;">0</div>
    <div style="color: var(--gold); font-size: 12px; letter-spacing: 2px; margin-bottom: 30px;">TOTAL DATA OBLITERATED</div>
    <button class="btn" onclick="initializeScan()">RE-SCAN GRID</button>
  </div>
</div>

<script>
/**
 * ============================================================================
 * SQUACHACERS 19X MASTER ENGINE
 * ============================================================================
 * Developer: Sonny (Matthew Stokes)
 * Brand: SquachAcers (fka Yetey)
 * Components: ModToes (Toe Spacers), OrthoScan AI
 * Antagonists: Anomalous Cryptid Environmental Research Society
 * ============================================================================
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 700;
canvas.width = W; canvas.height = H;

// --- GLOBAL STATE ---
let state = 'start';
let score = 0;
let dist = 0;
let wave = 1;
let lives = 5;
let inv = 0;
let gameTime = 0;
let waveT = 0;
let lastT = 0;
let speed = 250;
let txS = W / 2;
let shake = 0;

// --- ENTITY BUFFERS ---
let obs = [];
let beams = [];
let parts = [];
let rings = [];
let ws = {}; // Wave State Container

// --- WAVE DEFINITIONS ---
const MODES = [
  { id: 'modtoes', name: 'MODTOE ALIGNMENT', col: '#44ff44', icon: '🦶', type: 'align' },
  { id: 'creek', name: 'CRYPTID CREEK', col: '#2e7d32', icon: '🕵️‍♂️', type: 'frog' },
  { id: 'space', name: 'SPACE RUNNER', col: '#00ffff', icon: '🛸', type: 'dodge' },
  { id: 'kong', name: 'SQUACH KONG', col: '#ff8800', icon: '🦍', type: 'jump' },
  { id: 'galaga', name: 'ACERS INVASION', col: '#44aaff', icon: '👾', type: 'shoot' },
  { id: 'flappy', name: 'FLAPPY SQUACH', col: '#00ff88', icon: '🐦', type: 'flap' },
  { id: 'asteroids', name: 'UFO BELT', col: '#ff4444', icon: '☄️', type: 'thrust' }
];

// --- AUDIO ARCHITECTURE (WEB AUDIO API) ---
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type, duration, volume = 0.15) {
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, AC.currentTime);
  g.gain.setValueAtTime(volume, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + duration);
  o.connect(g);
  g.connect(AC.destination);
  o.start();
  o.stop(AC.currentTime + duration);
}

function sfxLaser() { playTone(800, 'square', 0.1); playTone(1200, 'sine', 0.08); }
function sfxHit() { playTone(120, 'sawtooth', 0.4, 0.3); }
function sfxPickup() { playTone(880, 'sine', 0.1, 0.2); playTone(1100, 'sine', 0.1, 0.2); }
function sfxJump() { playTone(350, 'sine', 0.15, 0.2); }
function sfxWave() { playTone(200, 'square', 0.3); playTone(400, 'square', 0.3); }

// --- INPUT SYSTEM ---
function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  return (x - rect.left) * (W / rect.width);
}

canvas.addEventListener('mousemove', e => { txS = getTouchPos(e); });
canvas.addEventListener('touchmove', e => { e.preventDefault(); txS = getTouchPos(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { 
  txS = getTouchPos(e); 
  if (state === 'playing') handleViralAction(); 
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') txS -= 45;
  if (e.key === 'ArrowRight') txS += 45;
  if (e.key === ' ' || e.key === 'ArrowUp') handleViralAction();
});

function handleViralAction() {
  const m = MODES[(wave - 1) % MODES.length];
  if (m.type === 'shoot' || m.type === 'dodge') {
    beams.push({ x: sqX, y: sqY - 30, vy: -900 });
    sfxLaser();
  }
  if (m.type === 'jump' && ws.grounded) {
    ws.vy = -18;
    ws.grounded = false;
    sfxJump();
  }
  if (m.type === 'frog') {
    ws.fy -= 75;
    sfxJump();
    checkFrogWin();
  }
  if (m.type === 'flap') {
    ws.vy = -12;
    playTone(400, 'triangle', 0.1);
  }
}

// --- VISUAL JUICE ---
function triggerViralPop(x, y, txt) {
  const p = document.createElement('div');
  p.className = 'popup';
  p.textContent = txt;
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.getElementById('gc').appendChild(p);
  setTimeout(() => p.remove(), 1200);
}

function spawnDebris(x, y, col) {
  for (let i = 0; i < 15; i++) {
    parts.push({
      x, y,
      vx: (Math.random() - 0.5) * 300,
      vy: (Math.random() - 0.5) * 300,
      life: 1,
      decay: 0.8 + Math.random(),
      size: 2 + Math.random() * 4,
      col: col
    });
  }
}

function createShockwave(x, y, col) {
  rings.push({ x, y, r: 10, life: 1, col: col });
}

// --- MASTER STATE MACHINE ---
function initializeScan() {
  score = 0; dist = 0; wave = 1; lives = 5; waveT = 0; gameTime = 0;
  inv = 0; sqX = W / 2; sqY = H - 130;
  state = 'playing';
  obs = []; beams = []; parts = []; rings = [];
  document.getElementById('ss').style.display = 'none';
  document.getElementById('gs').style.display = 'none';
  refreshWaveMetadata();
  lastT = performance.now();
  updateHealthDisplay();
  requestAnimationFrame(masterLoop);
}

function refreshWaveMetadata() {
  const m = MODES[(wave - 1) % MODES.length];
  ws = { 
    spawnTimer: 1, 
    vy: 0, 
    grounded: true, 
    fy: H - 85, 
    fx: W / 2,
    pollenCount: 0 
  };
  
  if (m.type === 'frog') buildCryptidLanes();
  
  const banner = document.getElementById('mode-banner');
  banner.textContent = m.icon + " " + m.name;
  banner.style.color = m.col;
  document.getElementById('waveHud').textContent = wave;
  sfxWave();
}

function buildCryptidLanes() {
  ws.lanes = [];
  for (let i = 0; i < 6; i++) {
    ws.lanes.push({
      y: 110 + (i * 85),
      dir: i % 2 === 0 ? 1 : -1,
      speed: 130 + (wave * 15),
      type: i % 3 === 0 ? 'drone' : 'investigator',
      items: [
        { x: Math.random() * W, w: 80 },
        { x: (Math.random() * W + 250) % W, w: 80 }
      ]
    });
  }
}

function updateHealthDisplay() {
  const container = document.getElementById('trees-hud');
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.textContent = '🌲';
    s.style.fontSize = '24px';
    s.style.opacity = i < lives ? '1' : '0.1';
    s.style.filter = i < lives ? 'drop-shadow(0 0 8px #44ff44)' : 'none';
    s.style.transition = 'all 0.4s ease';
    container.appendChild(s);
  }
}

function triggerDamage(x, y) {
  if (inv > 0) return;
  lives--;
  inv = 2.0;
  shake = 1.0;
  sfxHit();
  spawnDebris(x, y, '#ff3333');
  createShockwave(x, y, '#ff3333');
  updateHealthDisplay();
  if (lives <= 0) systemCrash();
}

function checkFrogWin() {
  if (ws.fy < 95) {
    score += 1200;
    triggerViralPop(W / 2, H / 2, "OBLITERATED ACERS!");
    sfxPickup();
    createShockwave(W / 2, H / 2, '#44ff44');
    ws.fy = H - 85;
    waveT = WAVE_DUR; // Force next wave
  }
}

function systemCrash() {
  state = 'gameover';
  document.getElementById('fs').textContent = Math.floor(score);
  document.getElementById('gs').style.display = 'flex';
  playTone(80, 'sawtooth', 0.8, 0.5);
}

// --- PHYSICS ENGINES ---
function updateEntities(dt, t) {
  const m = MODES[(wave - 1) % MODES.length];
  gameTime += dt;
  waveT += dt;
  dist += dt * 15;

  // Global Movement
  sqX += (txS - sqX) * 0.18;
  sqX = Math.max(35, Math.min(W - 35, sqX));

  // Mode Specific Gravity/Physics
  if (m.type === 'jump' || m.type === 'flap') {
    ws.vy += 0.6; // Gravity
    sqY += ws.vy;
    if (sqY > H - 130) {
      sqY = H - 130;
      ws.vy = 0;
      ws.grounded = true;
    }
    if (sqY < 50) sqY = 50;
  } else {
    sqY = H - 130;
  }

  // Spawning Logic
  ws.spawnTimer -= dt;
  if (ws.spawnTimer <= 0) {
    generateViralObstacle(m);
    ws.spawnTimer = Math.max(0.45, 0.9 - (wave * 0.08));
  }

  // Obstacle Processing
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i];
    o.y += o.vy * dt || 0;
    o.x += o.vx * dt || 0;

    // Viral Hitbox Detection
    const targetX = m.type === 'frog' ? ws.fx : sqX;
    const targetY = m.type === 'frog' ? ws.fy : sqY;
    const hitDist = Math.hypot(o.x - targetX, o.y - targetY);

    if (hitDist < 48) {
      if (o.type === 'modtoe') {
        score += 250;
        sfxPickup();
        createShockwave(o.x, o.y, '#44ff44');
        triggerViralPop(o.x, o.y, "ALIGNED!");
        obs.splice(i, 1);
      } else {
        triggerDamage(targetX, targetY);
        obs.splice(i, 1);
      }
    } else if (o.y > H + 100 || o.x < -150 || o.x > W + 150) {
      if (o.type === 'modtoe') triggerDamage(sqX, H - 20); // Missed ModToe alignment
      obs.splice(i, 1);
    }
  }

  // Beam Processing
  for (let j = beams.length - 1; j >= 0; j--) {
    const b = beams[j];
    b.y += b.vy * dt;
    if (b.y < -50) beams.splice(j, 1);

    for (let i = obs.length - 1; i >= 0; i--) {
      const o = obs[i];
      if (Math.hypot(b.x - o.x, b.y - o.y) < 45) {
        if (o.type !== 'modtoe') {
          score += 100;
          spawnDebris(o.x, o.y, m.col);
          obs.splice(i, 1);
          beams.splice(j, 1);
          break;
        }
      }
    }
  }

  // Wave Transition Logic
  if (waveT >= WAVE_DUR) {
    wave++;
    waveT = 0;
    refreshWaveMetadata();
  }

  // Juice Lifecycle
  if (inv > 0) inv -= dt;
  if (shake > 0) shake -= dt * 2;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += 200 * dt; r.life -= dt * 2.5;
    if (r.life <= 0) rings.splice(i, 1);
  }
}

function generateViralObstacle(m) {
  const laneX = [80, W / 2, W - 80];
  const x = laneX[Math.floor(Math.random() * 3)];

  if (m.type === 'align') {
    obs.push({ type: 'modtoe', x: Math.random() * (W - 100) + 50, y: -60, vy: 380 + (wave * 20) });
  } else if (m.type === 'frog') {
    // Lanes handle their own drawing/logic
  } else if (m.type === 'jump') {
    obs.push({ type: 'barrel', x: W + 60, y: H - 145, vx: -420 - (wave * 25), vy: 0 });
  } else {
    obs.push({ type: 'anom', x: Math.random() * W, y: -60, vy: 320 + (wave * 30), col: m.col });
  }
}

// --- RENDER ENGINE ---
function drawViralFrame(t) {
  ctx.save();
  if (shake > 0) {
    const s = shake * 8;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  // 1. Technical OrthoScan Grid
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#102210';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const m = MODES[(wave - 1) % MODES.length];

  // 2. Cryptid Creek Geometry
  if (m.type === 'frog') {
    ctx.fillStyle = 'rgba(46, 125, 50, 0.15)';
    ctx.fillRect(0, 0, W, 100); ctx.fillRect(0, H - 75, W, 75);
    ws.lanes.forEach(lane => {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, lane.y - 40, W, 80);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.setLineDash([15, 15]);
      ctx.beginPath(); ctx.moveTo(0, lane.y); ctx.lineTo(W, lane.y); ctx.stroke();
      ctx.setLineDash([]);
      lane.items.forEach(item => {
        item.x += lane.dir * lane.speed * 0.016;
        if (item.x > W + 50) item.x = -50; if (item.x < -50) item.x = W + 50;
        ctx.font = '40px Arial';
        ctx.fillText(lane.type === 'drone' ? '🛸' : '🕵️‍♂️', item.x, lane.y + 12);
        // Collision logic inside draw for smoother interpolation
        if (inv <= 0 && Math.abs(ws.fy - lane.y) < 30 && Math.abs(ws.fx - item.x) < 35) {
          triggerDamage(ws.fx, ws.fy); ws.fy = H - 85;
        }
      });
    });
  }

  // 3. Entity Rendering
  obs.forEach(o => {
    ctx.save();
    ctx.shadowBlur = 15; ctx.shadowColor = m.col;
    ctx.font = '48px Arial';
    ctx.textAlign = 'center';
    let icon = '👾';
    if (o.type === 'modtoe') icon = '🦶';
    if (o.type === 'barrel') icon = '🛢️';
    ctx.fillText(icon, o.x, o.y + 15);
    ctx.restore();
  });

  beams.forEach(b => {
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
    ctx.fillRect(b.x - 3, b.y, 6, 20);
  });

  // 4. Particle Effects
  parts.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  rings.forEach(r => {
    ctx.strokeStyle = r.col;
    ctx.globalAlpha = r.life;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  });

  // 5. Branded Squach Model
  const px = m.type === 'frog' ? ws.fx : sqX;
  const py = m.type === 'frog' ? ws.fy : sqY;
  
  ctx.save();
  ctx.translate(px, py);
  if (inv > 0 && Math.floor(t * 12) % 2 === 0) ctx.globalAlpha = 0.25;
  
  // Custom ModToe Rendering
  ctx.fillStyle = m.col;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.arc(i * 8.5, 28, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Tactical Squach Body
  ctx.shadowBlur = 25; ctx.shadowColor = m.col;
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 32, 0, 0, Math.PI * 2); ctx.fill();
  
  // AI Sensors (Eyes)
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(-7, -10, 4, 0, Math.PI * 2); ctx.arc(7, -10, 4, 0, Math.PI * 2); ctx.fill();
  
  ctx.restore();
  ctx.restore();

  // Update HUD values
  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('dc').textContent = Math.floor(dist) + 'm';
}

function masterLoop(ts) {
  if (state !== 'playing') return;
  const dt = Math.min((ts - lastT) / 1000, 0.08);
  lastT = ts;
  updateEntities(dt, ts / 1000);
  drawViralFrame(ts / 1000);
  requestAnimationFrame(masterLoop);
}
</script>
</body>
