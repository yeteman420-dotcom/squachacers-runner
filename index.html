<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SquachAcers: Universe Shifter 19X</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-bright: #FFD700; --red: #ff3333; --neon: #44ff44;
    --ortho: #00ffff; --tactical-bg: #010201; --ui-glow: rgba(68, 255, 68, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; outline: none; }
  body { background: #000; color: #fff; font-family: 'Exo 2', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
  
  #gc { 
    position: relative; width: min(500px, 100vw); height: min(700px, 100vh); 
    background: var(--tactical-bg); border: 2px solid #1a331a; overflow: hidden; 
    box-shadow: 0 0 60px #000, 0 0 25px var(--ui-glow); 
  }
  
  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
  
  /* --- HUD ARCHITECTURE --- */
  #hud { 
    position: absolute; top: 0; left: 0; right: 0; display: flex; 
    justify-content: space-between; padding: 15px 20px; pointer-events: none; z-index: 100; 
  }
  .hb { 
    display: flex; flex-direction: column; align-items: center; 
    background: rgba(0,0,0,0.8); padding: 8px 14px; border: 1px solid rgba(68,255,68,0.25); 
    border-radius: 4px; min-width: 95px; backdrop-filter: blur(5px);
  }
  .hl { font-family: 'Black Ops One', cursive; font-size: 10px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .hv { font-family: 'Black Ops One', cursive; font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--gold); }

  /* --- SYSTEM UI --- */
  .system-screen { 
    position: absolute; inset: 0; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; z-index: 200; padding: 40px; 
    text-align: center; background: rgba(0,0,0,0.97); backdrop-filter: blur(15px); 
  }
  #ss { background: radial-gradient(circle at center, #0a220a 0%, #000 100%); }
  .logo { font-family: 'Black Ops One', cursive; font-size: 52px; color: var(--neon); text-shadow: 0 0 35px #1a5e1a; letter-spacing: 6px; }
  .version-tag { font-family: 'Black Ops One', cursive; font-size: 12px; color: #666; letter-spacing: 8px; margin-bottom: 30px; }
  
  .btn { 
    font-family: 'Black Ops One', cursive; font-size: 20px; letter-spacing: 4px; 
    padding: 20px 55px; border: 2px solid var(--neon); background: transparent; 
    color: var(--neon); cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    text-transform: uppercase; margin-top: 25px; 
  }
  .btn:hover { background: rgba(68, 255, 68, 0.15); box-shadow: 0 0 30px var(--neon); transform: scale(1.05); }
  
  #mode-banner { 
    position: absolute; top: 90px; width: 100%; text-align: center; 
    font-family: 'Black Ops One', cursive; font-size: 16px; color: var(--neon); 
    z-index: 150; letter-spacing: 4px; text-shadow: 0 0 15px #000;
  }
  
  #integrity-meter { 
    position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); 
    display: flex; gap: 12px; z-index: 150; background: rgba(0,0,0,0.6); 
    padding: 10px 22px; border-radius: 40px; border: 1px solid rgba(68,255,68,0.3); 
  }
  
  .notification { 
    position: absolute; font-family: 'Black Ops One', cursive; font-size: 22px; 
    color: var(--ortho); pointer-events: none; z-index: 500; 
    animation: viralPop 1.2s ease-out forwards; text-shadow: 0 0 10px #000;
  }
  @keyframes viralPop { 0% { opacity: 0; transform: translateY(30px) scale(0.8); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.4); } }
</style>
</head>
<body>

<div id="gc">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">GRID_POINTS</div><div class="hv" id="sc">0</div></div>
    <div class="hb"><div class="hl">WAVE_SHIFT</div><div class="hv" id="waveHud">1</div></div>
    <div class="hb"><div class="hl">BONUS_X</div><div class="hv" id="mult">1.0</div></div>
  </div>

  <div id="mode-banner"></div>
  <div id="integrity-meter"></div>

  <div class="system-screen" id="ss">
    <div class="logo">SQUACHACERS</div>
    <div class="version-tag">19X TITAN BUILD</div>
    <div style="font-size: 90px; margin: 20px 0; filter: drop-shadow(0 0 20px #2e7d32);">🦶</div>
    <div style="color: #888; font-size: 14px; line-height: 1.8; letter-spacing: 1px;">
      ORTHOSCAN AI INTEGRITY: ACTIVE<br>
      ALIGN MODTOE MODULES<br>
      OBLITERATE ACERS ANOMALIES
    </div>
    <button class="btn" onclick="initializeEngine()">INITIALIZE SCAN</button>
  </div>

  <div class="system-screen" id="gs" style="display:none;">
    <div style="font-family:'Black Ops One'; font-size:48px; color:var(--red); text-shadow: 0 0 25px #600;">SQUACH DOWN</div>
    <div id="final-stats" style="font-size: 75px; color: #fff; margin: 15px 0;">0</div>
    <div class="hl" style="margin-bottom: 20px;">TOTAL GRID RECOVERY</div>
    <button class="btn" onclick="initializeEngine()">RE-SCAN GRID</button>
  </div>
</div>

<script>
/**
 * TITAN MASTER ENGINE
 * High-performance game logic with precise platforming and scaling.
 */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d', { alpha: false });
const W = 500, H = 700; canvas.width = W; canvas.height = H;

// --- CORE SYSTEM STATE ---
let state = 'standby', score = 0, wave = 1, lives = 5, inv = 0;
let sqX = W/2, sqY = H-140, txS = W/2, tyS = H-140, lastT = 0, waveT = 0, shake = 0;
let obs = [], beams = [], particles = [], ws = {};

const MODES = [
  { id:'modtoes', name:'MODTOE ALIGNMENT', col:'#44ff44', icon:'🦶', type:'align' },
  { id:'paccreek', name:'CRYPTID MAZE', col:'#00ffff', icon:'👾', type:'maze' },
  { id:'floopy', name:'FLOOPY SQUACH', col:'#00ff88', icon:'🐦', type:'flap' },
  { id:'kong', name:'SQUACH KONG', col:'#ff8800', icon:'🦍', type:'jump' }
];

// --- TEMPORAL INPUT ENGINE ---
const updateCoords = (e) => {
  const r = canvas.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  txS = (x - r.left) * (W / r.width);
  tyS = (y - r.top) * (H / r.height);
};
canvas.addEventListener('mousemove', updateCoords);
canvas.addEventListener('touchmove', e => { e.preventDefault(); updateCoords(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { updateCoords(e); if (state === 'active') executeAction(); }, { passive: false });

function executeAction() {
  const m = MODES[(wave-1)%MODES.length];
  if (['align', 'maze'].includes(m.type)) spawnBeam();
  if (m.type === 'flap') ws.vy = -15;
  if (m.type === 'jump' && ws.grounded) { ws.vy = -22; ws.grounded = false; }
}

function spawnBeam() {
  beams.push({ x: sqX, y: sqY - 40, vy: -1400, col: '#00ffff' });
}

// --- VISUAL JUICE & FEEDBACK ---
function createDebris(x, y, col, count=10) {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*400, vy: (Math.random()-0.5)*400,
      life: 1.0, decay: 1.5 + Math.random(), col
    });
  }
}

function notify(x, y, txt) {
  const p = document.createElement('div'); p.className = 'notification'; p.textContent = txt;
  p.style.left = x + 'px'; p.style.top = y + 'px';
  document.getElementById('gc').appendChild(p); setTimeout(()=>p.remove(), 1200);
}

// --- HUD SYNCHRONIZATION ---
function syncHUD() {
  const mult = 1 + (wave * 0.25);
  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('waveHud').textContent = wave;
  document.getElementById('mult').textContent = mult.toFixed(1);
  
  const meter = document.getElementById('integrity-meter'); meter.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span'); s.textContent = '🌲';
    s.style.fontSize = '26px'; s.style.opacity = i < lives ? '1' : '0.1';
    s.style.filter = i < lives ? 'drop-shadow(0 0 8px #44ff44)' : 'grayscale(1)';
    meter.appendChild(s);
  }
}

// --- GAME LOGIC LOOPS ---
function initializeEngine() {
  score = 0; wave = 1; lives = 5; waveT = 0; state = 'active';
  obs = []; beams = []; particles = [];
  document.getElementById('ss').style.display = 'none';
  document.getElementById('gs').style.display = 'none';
  configureWave(); lastT = performance.now(); syncHUD(); requestAnimationFrame(mainLoop);
}

function configureWave() {
  const m = MODES[(wave - 1) % MODES.length];
  const scale = 1 + (wave * 0.2); // LOGIC: Difficulty Scaling Factor
  ws = { 
    spawn: 1.0 / scale, vy: 0, grounded: true, 
    dots: [], scale, girders: [H-150, H-320, H-490] 
  };
  
  if (m.type === 'maze') {
    for(let i=0; i < 8 + wave; i++) ws.dots.push({x: 50 + Math.random()*(W-100), y: 100 + Math.random()*(H-200), active: true});
    sqX = W/2; sqY = H/2;
  }
  document.getElementById('mode-banner').textContent = m.icon + " " + m.name;
  document.getElementById('mode-banner').style.color = m.col;
}

function processDamage(x, y) {
  if (inv > 0) return; lives--; inv = 2.0; shake = 2.0;
  createDebris(x, y, '#ff3333', 20);
  if(lives <= 0) state = 'over'; syncHUD();
}

function mainLoop(ts) {
  if (state !== 'active') {
    if (state === 'over') { document.getElementById('gs').style.display='flex'; document.getElementById('final-stats').textContent=Math.floor(score); }
    return;
  }
  const dt = Math.min((ts - lastT) / 1000, 0.1); lastT = ts;
  waveT += dt; 
  const m = MODES[(wave - 1) % MODES.length];

  // --- PHYSICS ENGINE ---
  if (m.type === 'maze') {
    sqX += (txS - sqX) * 0.18; sqY += (tyS - sqY) * 0.18;
  } else if (m.type === 'jump') {
    sqX += (txS - sqX) * 0.25; ws.vy += 1.2; sqY += ws.vy; ws.grounded = false;
    ws.girders.forEach(gy => {
      if (ws.vy > 0 && sqY > gy-40 && sqY < gy && sqX > 10 && sqX < W-10) {
        sqY = gy-40; ws.vy = 0; ws.grounded = true;
      }
    });
  } else if (m.type === 'flap') {
    ws.vy += 0.7; sqY += ws.vy;
    if (sqY > H-60 || sqY < 40) processDamage(sqX, sqY);
  } else {
    sqX += (txS - sqX) * 0.25; sqY = H-140;
  }
  sqX = Math.max(30, Math.min(W-30, sqX));

  // --- SPAWN ENGINE (EXPONENTIAL SCALING) ---
  ws.spawn -= dt;
  if (ws.spawn <= 0) {
    const spd = (280 + (wave * 30)) * Math.min(ws.scale, 2.5);
    if (m.type === 'maze') obs.push({ id:'acer', x: Math.random()*W, y:-50, vy: spd*0.6, vx: (Math.random()-0.5)*300 });
    else if (m.type === 'align') obs.push({ id:'modtoe', x: Math.random()*(W-80)+40, y:-60, vy: spd });
    else if (m.type === 'jump') obs.push({ id:'barrel', x: W+50, y: ws.girders[Math.floor(Math.random()*3)]-38, vx: -spd*0.8 });
    else obs.push({ id:'anom', x: Math.random()*W, y:-60, vy: spd * 1.1 });
    ws.spawn = 0.85 / ws.scale;
  }

  // --- COLLISION ARCHITECTURE ---
  for (let i = beams.length - 1; i >= 0; i--) {
    let b = beams[i]; b.y += b.vy * dt;
    obs.forEach((o, oi) => {
      if (Math.hypot(b.x - o.x, b.y - o.y) < 45) {
        score += 50 * ws.scale; createDebris(o.x, o.y, '#00ffff');
        obs.splice(oi, 1); beams.splice(i, 1);
      }
    });
    if (b.y < -50) beams.splice(i, 1);
  }

  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i]; o.y += (o.vy || 0) * dt; o.x += (o.vx || 0) * dt;
    if (Math.hypot(o.x - sqX, o.y - sqY) < 48) {
      if (o.id === 'modtoe') { score += 300 * ws.scale; notify(o.x, o.y, "ALIGNED"); obs.splice(i, 1); }
      else { processDamage(sqX, sqY); obs.splice(i, 1); }
    } else if (o.y > H + 60 || o.x < -120) {
      if (o.id === 'modtoe') processDamage(sqX, H-20);
      obs.splice(i, 1);
    }
  }

  // --- MAZE DOT LOGIC ---
  if (m.type === 'maze') {
    ws.dots.forEach(d => { if(d.active && Math.hypot(d.x-sqX, d.y-sqY) < 35) { d.active = false; score += 150; createDebris(d.x, d.y, '#fff', 5); }});
    if (ws.dots.every(d => !d.active)) { score += 2000; waveT = 40; notify(W/2, H/2, "MAZE CLEAR"); }
  }

  // --- WAVE TRANSITIONS ---
  if (waveT > 35) { score += wave * 1500; wave++; waveT = 0; configureWave(); notify(W/2, H/2, "UNIVERSE SHIFT"); }
  if (inv > 0) inv -= dt; if (shake > 0) shake -= dt * 5;
  particles.forEach((p, i) => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt; if(p.life <= 0) particles.splice(i,1); });

  // --- RENDER BLOCK ---
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#122512'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  
  if(m.type === 'maze') ws.dots.forEach(d => { if(d.active) { ctx.fillStyle = '#fff'; ctx.shadowBlur=15; ctx.shadowColor='#fff'; ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }});
  if(m.type === 'jump') { ctx.fillStyle='#1a331a'; ws.girders.forEach(gy => ctx.fillRect(10, gy, W-20, 15)); }

  particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 4, 4); });
  ctx.globalAlpha = 1.0;

  beams.forEach(b => { ctx.fillStyle = '#00ffff'; ctx.shadowBlur=10; ctx.shadowColor='#00ffff'; ctx.fillRect(b.x-2, b.y, 4, 25); ctx.shadowBlur=0; });
  obs.forEach(o => { ctx.font = '45px Arial'; ctx.textAlign = 'center'; ctx.fillText(o.id==='modtoe'?'🦶':o.id==='acer'?'🕵️‍♂️':o.id==='barrel'?'🛢️':'👾', o.x, o.y+15); });

  // --- TACTICAL SQUACH MODEL ---
  ctx.save(); ctx.translate(sqX, sqY);
  if (inv > 0 && Math.floor(ts / 80) % 2 === 0) ctx.globalAlpha = 0.2;
  // ModToes Rendering
  ctx.fillStyle = m.col; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 9, 32, 5, 0, Math.PI * 2); ctx.fill(); }
  // Body
  ctx.shadowBlur = 25; ctx.shadowColor = m.col;
  ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 36, 0, 0, Math.PI * 2); ctx.fill();
  // AI Optic Sensors
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, -10, 6, 0, Math.PI*2); ctx.arc(8, -10, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8, -10, 3, 0, Math.PI*2); ctx.arc(8, -10, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  syncHUD();
  requestAnimationFrame(mainLoop);
}
</script>
</body>
</html>
